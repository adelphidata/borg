[graph]
targets = []
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # rustls-pemfile is unmaintained — functionality moved into rustls-pki-types.
    # Pulled transitively (reqwest/rustls-native-certs); revisit when upstream
    # deps drop it.
    "RUSTSEC-2025-0134",
    # --- songbird lockfile artifacts NOT compiled into borg's voice build ---
    # These reach Cargo.lock only via songbird 0.6, behind the opt-in
    # `discord-voice-channels` feature: songbird's MANDATORY DAVE (E2EE) dep
    # `davey` → openmls → hpke-rs pulls the libcrux family, but openmls selects
    # the `hpke-rs-rust-crypto` backend in the resolved feature set, so libcrux
    # is never built. `cargo tree -i <crate> -e normal` finds none of them in the
    # default feature set — only `all-features = true` in [graph] pulls
    # them. Revisit when openmls drops libcrux from its graph or voice is dropped.
    "RUSTSEC-2026-0207", # libcrux-sha3: wrong incremental portable SHAKE output
    "RUSTSEC-2026-0208", # libcrux-sha3: panic in AVX2 SHAKE-256
    "RUSTSEC-2026-0212", # libcrux-secrets: constant-time swap/select on aarch64
    # ringbuf 0.4 IS built with voice on (songbird's driver needs it), but the
    # bug only fires when an element's `Drop` panics. songbird's only ring
    # buffer holds `u8` (input/adapters/async_adapter.rs), which has no `Drop`.
    # No songbird release takes ringbuf >= 0.5.2 yet; drop this when one does.
    "RUSTSEC-2026-0293", # ringbuf: double free in Consumer::skip/clear on panicking Drop
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "NCSA",
    # webpki-roots / webpki-root-certs ship Mozilla's CA bundle under the
    # Community Data License Agreement. Permissive, data-only, no copyleft
    # reach into the binary that links them.
    "CDLA-Permissive-2.0",
    # whisper-rs / whisper-rs-sys (local speech-to-text) are dedicated to the
    # public domain, which is strictly more permissive than anything above.
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
