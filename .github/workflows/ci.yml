name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which surfaces did this change touch? Filtering here (rather than with
  # top-level `paths:`) keeps every job present as a required check — a skipped
  # job still reports success, a filtered-out workflow reports nothing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/**'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'buf.gen.yaml'
              - '.github/workflows/**'
              # Proto changes flip both: Rust regenerates via build.rs, and the
              # committed TypeScript client must be regenerated to match.
              - 'crates/protocols/proto/**'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --lib --bins

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - run: cargo build

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        # Ratchet, not the target. The standard in CLAUDE.md is 90%; this
        # number tracks where the workspace actually is and only ever moves
        # up, so coverage can never silently regress while we climb.
        run: cargo llvm-cov --workspace --lib --bins --fail-under-lines 77 --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo-audit
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo audit

  deny:
    name: Dependency Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  # Windows-only sandbox surface (CreateRestrictedToken, anonymous-pipe
  # SpawnRequest IPC, job objects, mitigation policies, isolated desktop,
  # stable cap SIDs) lives entirely under `crates/sandbox/src/windows/`
  # behind `#[cfg(target_os = "windows")]`. We compile + run the
  # sandbox crate's tests on a Windows runner per-PR so a Windows-only
  # regression surfaces before merge, not on the release lane.
  #
  # Scoped to `-p sandbox` deliberately: the full workspace has C
  # dependencies (ring, etc.) that need a Windows VC++ toolchain we
  # don't otherwise need. The Windows-only sandbox tests are the
  # high-value lane; full-workspace Windows builds remain in
  # `release.yml`.
  windows-sandbox:
    name: Windows Sandbox
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-windows-sandbox-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-windows-sandbox-
      - name: cargo fmt --check (sandbox)
        run: cargo fmt -p sandbox --check
      - name: cargo clippy -p sandbox
        run: cargo clippy -p sandbox --all-targets -- -D warnings
      - name: cargo test -p sandbox (lib + bins)
        run: cargo test -p sandbox --lib --bins
      - name: cargo test -p sandbox (real-FFI smoke)
        # Phase 12 partial-coverage lane: drives real CreatePipe /
        # CreateDesktopW / CryptProtectData / CreatePseudoConsole on
        # the runner. See `crates/sandbox/tests/windows_ffi_smoke.rs`
        # for the carve-out vs full-VM validation.
        run: cargo test -p sandbox --test windows_ffi_smoke

  gen-drift:
    name: Proto codegen drift
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The committed TypeScript client must match crates/protocols/proto. If it
      # does not, a proto change landed without regenerating — run `just gen`.
      - run: bun x buf generate
      - run: git diff --exit-code packages/client/src/gen

  web:
    name: Web surfaces
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun x prettier --check "apps/**/*.{ts,tsx,css,html}" "packages/**/*.{ts,tsx}"
      - name: Typecheck every package
        run: bun run --filter '*' typecheck
      - name: Unit tests
        # Coverage thresholds live in each package's vitest.config; this is
        # where a drop below them fails the build.
        run: |
          bun run --cwd packages/client test --coverage.enabled
          bun run --cwd packages/ui test --coverage.enabled
          bun run --cwd packages/app test --coverage.enabled
          bun run --cwd apps/desktop test --coverage.enabled
          bun run --cwd apps/web test --coverage.enabled
      - name: Build browser SPA
        run: bun run --cwd apps/web build
      - name: Build desktop app
        run: bun run --cwd apps/desktop build
