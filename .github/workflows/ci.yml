name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The Rust toolchain comes from rust-toolchain.toml: `rustup toolchain install`
# with no argument installs exactly that pin, so CI and local builds agree.

jobs:
  # Which surfaces did this change touch? Filtering here (rather than with
  # top-level `paths:`) keeps every job present as a required check — a skipped
  # job still reports success, a filtered-out workflow reports nothing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/**'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'buf.gen.yaml'
              - '.github/workflows/**'
              # Proto changes flip both: Rust regenerates via build.rs, and the
              # committed TypeScript client must be regenerated to match.
              - 'crates/protocols/proto/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - run: rustup toolchain install
      # rustfmt ignores `cfg`, so this also covers the Windows-only sandbox code.
      - run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # One test run that also measures coverage: `cargo llvm-cov` runs the same
  # `--lib --bins` suite a plain `cargo test` would, and links every lib and bin.
  test:
    name: Test + Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Coverage instrumentation needs no DWARF; without it the instrumented
      # workspace fits on the runner disk.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: Install system dependencies
        # bubblewrap lets the Linux sandbox tests wrap for real instead of
        # falling back to an unsandboxed passthrough.
        run: |
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        # Ratchet, not the target. The standard is 90%; this number tracks
        # where the workspace actually is and only ever moves up, so coverage
        # can never silently regress while we climb.
        run: cargo llvm-cov --workspace --lib --bins --no-fail-fast --fail-under-lines 81 --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Advisories, licenses, bans and sources in one pass. It reads deny.toml,
  # which is the single list of accepted advisories.
  deny:
    name: Dependency Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  # Windows-only sandbox surface (CreateRestrictedToken, anonymous-pipe
  # SpawnRequest IPC, job objects, mitigation policies, isolated desktop,
  # stable cap SIDs) lives entirely under `crates/sandbox/src/windows/`
  # behind `#[cfg(target_os = "windows")]`. We compile + run the
  # sandbox crate's tests on a Windows runner per-PR so a Windows-only
  # regression surfaces before merge, not on the release lane.
  #
  # Sandbox lint + FFI smoke, the named-pipe transport against real
  # Windows pipes, and a compile of both shipped binaries so a unix-only
  # API in borg or borgd fails here rather than at release time.
  windows-sandbox:
    name: Windows Sandbox
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sandbox --all-targets -- -D warnings
      - name: cargo test -p sandbox (lib + real-FFI smoke)
        # The smoke test drives real CreatePipe / CreateDesktopW /
        # CryptProtectData / CreatePseudoConsole on the runner. See
        # `crates/sandbox/tests/windows_ffi_smoke.rs` for the carve-out vs
        # full-VM validation.
        run: cargo test -p sandbox --lib --bins --test windows_ffi_smoke
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - name: cargo test -p protocols (named-pipe transport)
        run: cargo test -p protocols
      - name: cargo check borg + borgd
        run: cargo check --bin borg --bin borgd

  web:
    name: Web surfaces
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Proto codegen drift
        # The committed TypeScript client must match crates/protocols/proto. If
        # it does not, a proto change landed without regenerating — run `just gen`.
        run: |
          bun x buf generate
          git diff --exit-code packages/client/src/gen
      - name: Format check
        run: bun x prettier --check "apps/**/*.{ts,tsx,css,html}" "packages/**/*.{ts,tsx}"
      - name: Typecheck every package
        run: bun run --filter '*' typecheck
      - name: Unit tests
        # Coverage thresholds live in each package's vitest.config; this is
        # where a drop below them fails the build.
        run: |
          bun run --cwd packages/client test --coverage.enabled
          bun run --cwd packages/ui test --coverage.enabled
          bun run --cwd packages/app test --coverage.enabled
          bun run --cwd apps/desktop test --coverage.enabled
          bun run --cwd apps/web test --coverage.enabled
      - name: Build browser SPA
        run: bun run --cwd apps/web build
      - name: Build desktop app
        run: bun run --cwd apps/desktop build
