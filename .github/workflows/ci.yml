name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --lib --bins

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - run: cargo build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lib --bins --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install cargo-audit
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo audit

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  # Windows-only sandbox surface (CreateRestrictedToken, anonymous-pipe
  # SpawnRequest IPC, job objects, mitigation policies, isolated desktop,
  # stable cap SIDs) lives entirely under `crates/sandbox/src/windows/`
  # behind `#[cfg(target_os = "windows")]`. We compile + run the
  # sandbox crate's tests on a Windows runner per-PR so a Windows-only
  # regression surfaces before merge, not on the release lane.
  #
  # Scoped to `-p sandbox` deliberately: the full workspace has C
  # dependencies (ring, etc.) that need a Windows VC++ toolchain we
  # don't otherwise need. The Windows-only sandbox tests are the
  # high-value lane; full-workspace Windows builds remain in
  # `release.yml`.
  windows-sandbox:
    name: Windows Sandbox
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-windows-sandbox-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-windows-sandbox-
      - name: cargo fmt --check (sandbox)
        run: cargo fmt -p sandbox --check
      - name: cargo clippy -p sandbox
        run: cargo clippy -p sandbox --all-targets -- -D warnings
      - name: cargo test -p sandbox (lib + bins)
        run: cargo test -p sandbox --lib --bins
      - name: cargo test -p sandbox (real-FFI smoke)
        # Phase 12 partial-coverage lane: drives real CreatePipe /
        # CreateDesktopW / CryptProtectData / CreatePseudoConsole on
        # the runner. See `crates/sandbox/tests/windows_ffi_smoke.rs`
        # for the carve-out vs full-VM validation.
        run: cargo test -p sandbox --test windows_ffi_smoke
