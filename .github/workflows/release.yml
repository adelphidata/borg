name: Release

# One release train. A `vX.Y.Z` tag carries everything a user can download:
# the `borg` + `borgd` archives (which `borg update` reads) and the desktop
# installers (which electron-updater reads). Two ways in:
#
#   - Actions → Release → Run workflow: pick a version and a ref. The tag is
#     created only after every asset has built, so a failed run leaves no
#     half-made tag or release behind. `mode: artifacts` builds the assets as
#     workflow artifacts and publishes nothing.
#   - `git push origin vX.Y.Z`: builds and publishes that tag.
#
# The committed versions (Cargo workspace + apps/desktop/package.json) must
# equal the release version, so the binaries report the version they ship as.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0 or 0.2.0-rc.1)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: false
        default: main
        type: string
      mode:
        description: "publish = public release, draft = draft release, artifacts = build only"
        required: false
        default: publish
        type: choice
        options: [publish, draft, artifacts]
      skip_ci_check:
        description: "Release even if CI has not passed on this commit"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

# Two runs for one version must never race to create the same tag.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      mode: ${{ steps.meta.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve version, tag, and commit
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # checkout only takes full names, so a short SHA is resolved here and
          # every later job builds the full SHA.
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            sha=$(git rev-parse -q --verify "origin/$INPUT_REF^{commit}" || git rev-parse -q --verify "$INPUT_REF^{commit}") || {
              echo "::error::No branch, tag, or commit named '$INPUT_REF'"
              exit 1
            }
            git checkout -q "$sha"
          fi
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            mode="$INPUT_MODE"
          else
            version="${REF_NAME#v}"
            mode=publish
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$version'. Expected X.Y.Z or X.Y.Z-pre.N"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$prerelease"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version from $(git rev-parse HEAD) (mode: $mode, prerelease: $prerelease)"
      - name: Committed versions match the release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          desktop_version=$(jq -r .version apps/desktop/package.json)
          ok=true
          if [[ "$cargo_version" != "$VERSION" ]]; then
            echo "::error file=Cargo.toml::workspace version is $cargo_version, release is $VERSION"
            ok=false
          fi
          if [[ "$desktop_version" != "$VERSION" ]]; then
            echo "::error file=apps/desktop/package.json::version is $desktop_version, release is $VERSION"
            ok=false
          fi
          $ok
      - name: Tag and release are free
        if: steps.meta.outputs.mode != 'artifacts'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it or pick a new version."
            exit 1
          fi
          # A tag push arrives with its tag in place; a dispatch must not reuse one.
          if tag_sha=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$tag_sha" != "$SHA" ]]; then
              echo "::error::Tag $TAG already points at $tag_sha, not $SHA"
              exit 1
            fi
          fi
      - name: CI passed on this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
          if [[ "$passed" == "0" ]]; then
            echo "::error::No successful CI run for $SHA. Wait for CI, or re-run with skip_ci_check."
            exit 1
          fi

  # borg + borgd per target. The archive layout (`borg` at the root, named
  # borg-<os>-<arch>) is what `borg update` downloads and verifies.
  cli:
    name: CLI (${{ matrix.asset }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: borg-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: borg-darwin-x86_64
          # The oldest supported Ubuntu keeps the glibc floor low.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: borg-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: borg-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: borg-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev libasound2-dev pkg-config
      - uses: oven-sh/setup-bun@v2
      - name: Build web UI
        # ORDER MATTERS: borgd embeds apps/web/dist via rust-embed at compile
        # time. Building this after cargo would ship a binary with no web UI.
        run: |
          bun install --frozen-lockfile
          bun run --cwd apps/web build
          test -f apps/web/dist/index.html
      # No build cache: a release compiles from a clean tree.
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin borg --bin borgd
      - name: Smoke test
        shell: bash
        run: |
          out=$(target/${{ matrix.target }}/release/borg --version)
          echo "$out"
          [[ "$out" == *"${{ needs.prepare.outputs.version }}"* ]]
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$bin/borg.exe" "$bin/borgd.exe" dist/
            (cd dist && 7z a "../${{ matrix.asset }}.zip" borg.exe borgd.exe)
          else
            cp "$bin/borg" "$bin/borgd" dist/
            tar -C dist -czf "${{ matrix.asset }}.tar.gz" borg borgd
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error

  # The installers carry the same borgd the CLI archive ships (see
  # electron-builder.yml extraResources), so a fresh machine needs nothing on
  # PATH and the two can never drift.
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [prepare, cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            cli: borg-darwin-arm64
          - os: macos-15-intel
            name: macos-x64
            cli: borg-darwin-x86_64
          - os: ubuntu-22.04
            name: linux-x64
            cli: borg-linux-x86_64
          - os: ubuntu-22.04-arm
            name: linux-arm64
            cli: borg-linux-arm64
          - os: windows-latest
            name: windows-x64
            cli: borg-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.cli }}
          path: cli
      - name: Stage borgd for the installer
        shell: bash
        run: |
          mkdir -p apps/desktop/resources/bin
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z e -y cli/${{ matrix.cli }}.zip borgd.exe -oapps/desktop/resources/bin
          else
            tar -xzf cli/${{ matrix.cli }}.tar.gz -C apps/desktop/resources/bin borgd
          fi
          ls -la apps/desktop/resources/bin
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Signing is credential-gated: set these repository secrets and the
          # same run signs (and on macOS notarizes) with no workflow change.
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--publish never)
          if [[ -z "$CSC_LINK" ]]; then
            # No certificate: never pick up a stray identity from the runner.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            # Apple silicon refuses to launch an app whose signature is broken
            # ("damaged"), so an unsigned mac build is ad-hoc signed instead.
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              args+=(-c.mac.identity=-)
            fi
          fi
          # electron-builder's bundled .deb packer is x64-only.
          if [[ "${{ matrix.name }}" == "linux-arm64" ]]; then
            args+=(--linux AppImage)
          fi
          bun run --cwd apps/desktop dist "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          # Installers plus the blockmaps and latest*.yml feeds electron-updater
          # reads; the unpacked per-platform scratch directories stay behind.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      MODE: ${{ needs.prepare.outputs.mode }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p dist
          # Each mac arch writes its own latest-mac.yml; electron-updater wants
          # one feed listing both, and picks the file whose name says arm64 on
          # Apple silicon. x64 goes last so the legacy top-level `path` points
          # at the build every Mac can run.
          # shellcheck disable=SC2016 # `$f` is a yq variable, not a shell one.
          yq eval-all '. as $f ireduce ({}; . *+ $f)' \
            artifacts/desktop-macos-arm64/latest-mac.yml \
            artifacts/desktop-macos-x64/latest-mac.yml > dist/latest-mac.yml
          rm artifacts/desktop-macos-*/latest-mac.yml
          find artifacts -type f -exec mv -n {} dist/ \;
          cat dist/latest-mac.yml
          cd dist
          sha256sum -- * > checksums.txt
          ls -la
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'artifacts'
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: dist/*
      - name: Create release
        if: env.MODE != 'artifacts'
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          # A tag push already has its tag; a dispatch creates it here, at the
          # exact commit that was built.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$SHA")
          fi
          # Upload into a draft and publish only once every asset is in, so a
          # release is never visible with half its downloads.
          gh release create "$TAG" "${flags[@]}" dist/*
          if [[ "$MODE" == "publish" ]]; then
            args=(--draft=false)
            if [[ "$PRERELEASE" != "true" ]]; then
              args+=(--latest)
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
