[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/adelphidata/borg"
homepage = "https://github.com/adelphidata/borg"
readme = "README.md"
authors = ["Adelphi Data, Inc."]
rust-version = "1.97"
keywords = ["ai", "assistant", "agent", "llm", "cli"]
categories = ["command-line-utilities"]

[workspace]
resolver = "2"
members = [
    "crates/interface",
    "crates/cortex",
    "crates/heartbeat",
    "crates/sandbox",
    "crates/coding",
    "crates/gateway",
    "crates/plugins",
    "crates/protocols",
    "crates/borgd",
    "crates/identity",
    "crates/mcp",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "multipart", "rustls-no-provider", "charset", "http2", "cookies", "form", "query"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
which = "8"
futures = "0.3"
futures-util = "0.3"
dirs = "7"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tar = "0.4"
zstd = "0.14"
tiktoken-rs = "0.12"
dotenvy = "0.15"
# ratatui 0.29 line: tui-textarea 0.7 (its latest release) pins ratatui ^0.29, which
# also holds crossterm at 0.28, throbber-widgets-tui at 0.9 and ansi-to-tui at 7.
ratatui = { version = "0.29", features = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
    "unstable-backend-writer",
    "scrolling-regions",
] }
pretty_assertions = "1"
url = "2"
itertools = "0.15"
tui-textarea = "0.7"
pulldown-cmark = "0.13"
textwrap = "0.16"
unicode-normalization = "0.1"
unicode-width = "0.2"
regex = "1"
libsql = { version = "0.10", default-features = false, features = ["core", "encryption"] }
roaring = "0.11"
scraper = "0.29"
pdf-extract = "0.12"
anydoc = "0.2.4"
shellexpand = "3"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
axum = "0.8"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
tower = { version = "0.5", features = ["limit"] }
tracing-appender = "0.2"
throbber-widgets-tui = "0.9"
ignore = "0.4"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "metrics", "logs", "grpc-tonic"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"
http = "1"
tracing-opentelemetry = "0.34"
chromiumoxide = { version = "0.9", default-features = false }
notify = "8"
image = "0.25"
arboard = "3"
strsim = "0.11"
libc = "0.2"
tokio-util = "0.7"
base64 = "0.23"
async-trait = "0.1"
rand = "0.10"
ed25519-dalek = { version = "3", features = ["rand_core"] }
wasmparser = "0.262"
wasmtime = "50"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-web = "0.14"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
time = { version = "0.3", features = ["macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
spake2 = "0.4"
blake3 = "1"
keyring = "4"
keyring-core = "1"
hkdf = "0.13"
scrypt = { version = "0.12", default-features = false }
chacha20poly1305 = "0.11"
x509-parser = "0.18"
qrcodegen = "1"
prost = "0.14"
prost-types = "0.14"
hyper-util = { version = "0.1", features = ["tokio"] }
fs2 = "0.4"
tokio-stream = { version = "0.1", features = ["net", "sync"] }

[workspace.lints.clippy]
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
expect_used = "deny"
unwrap_used = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

# scrypt is a memory-hard loop by design. Unoptimized, one derivation takes
# about 3 s, which a debug daemon on a file KEK pays on every boot.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
