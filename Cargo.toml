[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adelphidata/borg"
homepage = "https://github.com/adelphidata/borg"
readme = "README.md"
authors = ["Borg Contributors"]
rust-version = "1.88"
keywords = ["ai", "assistant", "agent", "llm", "cli"]
categories = ["command-line-utilities"]

[workspace]
resolver = "2"
members = [
    "crates/interface",
    "crates/cortex",
    "crates/heartbeat",
    "crates/sandbox",
    "crates/coding",
    "crates/gateway",
    "crates/plugins",
    "crates/protocols",
    "crates/borgd",
    "crates/identity",
    "crates/mcp",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "multipart", "rustls-tls", "charset", "http2", "cookies"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
which = "7"
futures = "0.3"
futures-util = "0.3"
dirs = "6"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tar = "0.4"
zstd = "0.13"
tiktoken-rs = "0.11"
dotenvy = "0.15"
ratatui = { version = "0.29", features = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
    "unstable-backend-writer",
    "scrolling-regions",
] }
pretty_assertions = "1"
url = "2"
itertools = "0.14"
tui-textarea = "0.7"
pulldown-cmark = "0.13"
textwrap = "0.16"
unicode-normalization = "0.1"
unicode-width = "0.2"
regex = "1"
libsql = { version = "0.9", default-features = false, features = ["core", "encryption"] }
# Pinned to keep MSRV at 1.88 — roaring 0.11.3+ requires rustc 1.90.
# Revisit when the workspace rust-toolchain bumps past 1.90.
roaring = "=0.11.2"
scraper = "0.22"
pdf-extract = "0.10"
shellexpand = "3"
sha2 = "0.10"
hmac = "0.12"
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tracing-appender = "0.2"
throbber-widgets-tui = "0.9"
ignore = "0.4"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "metrics", "logs", "grpc-tonic"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = "0.32"
http = "1"
tracing-opentelemetry = "0.33"
chromiumoxide = { version = "0.9", default-features = false }
notify = "7"
image = "0.25"
arboard = "3"
strsim = "0.11"
libc = "0.2"
tokio-util = "0.7"
base64 = "0.22"
async-trait = "0.1"
rand = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
wasmparser = "0.244"
wasmtime = "36"
tonic = { version = "0.12", features = ["tls"] }
tonic-build = "0.12"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = { version = "0.3", features = ["macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
spake2 = "0.4"
blake3 = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
x509-parser = "0.16"
qrcodegen = "1"
prost = "0.13"
prost-types = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
fs2 = "0.4"
tokio-stream = { version = "0.1", features = ["net", "sync"] }

[workspace.lints.clippy]
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
expect_used = "deny"
unwrap_used = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
