<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Borg</title>
    <!-- Space Grotesk is bundled locally (src/styles/fonts.css) — no network needed. -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-paint theme application to avoid a light flash before React's
      // ThemeProvider (src/lib/theme.tsx) takes over. Key must match its STORAGE_KEY.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("borg.theme") === "light" ? "light" : "dark";
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
