syntax = "proto3";

package borg.admin.v1;

// Admin surfaces lifecycle, settings, and the data-access RPCs that replace
// direct DB reads from the TUI popups.
service Admin {
  // Pairing — full impl arrives in Task 02.
  rpc Pair(PairRequest) returns (PairResponse);

  rpc Poke(Empty) returns (Empty);
  rpc Heal(Empty) returns (HealReport);
  rpc Shutdown(Empty) returns (Empty);

  // Settings.
  rpc GetSettings(Empty) returns (SettingsSnapshot);
  rpc SetSetting(SettingMutation) returns (Empty);
  rpc UnsetSetting(SettingKey) returns (Empty);

  // Sessions.
  rpc ListSessions(Empty) returns (SessionList);
  rpc GetSession(SessionRef) returns (SessionDetail);

  // Projects.
  rpc ListProjects(Empty) returns (ProjectList);
  rpc CreateProject(ProjectCreate) returns (Project);
  rpc UpdateProject(ProjectUpdate) returns (Project);
  rpc DeleteProject(ProjectRef) returns (Empty);

  // Scheduled tasks.
  rpc ListScheduledTasks(Empty) returns (ScheduledTaskList);
  rpc CreateScheduledTask(ScheduledTaskCreate) returns (ScheduledTask);
  rpc DeleteScheduledTask(ScheduledTaskRef) returns (Empty);
  rpc PauseScheduledTask(ScheduledTaskRef) returns (Empty);
  rpc ResumeScheduledTask(ScheduledTaskRef) returns (Empty);

  // Pairing requests + approved senders.
  rpc ListPairingRequests(PairingFilter) returns (PairingRequestList);
  rpc ApprovePairing(PairingApproval) returns (Empty);
  rpc ListApprovedSenders(PairingFilter) returns (ApprovedSenderList);
  rpc RevokeApprovedSender(ApprovedSenderRef) returns (Empty);

  // Daemon-wide status snapshot (replaces several DB reads from the TUI).
  rpc GetDaemonStatus(Empty) returns (DaemonStatus);
}

message Empty {}

message PairRequest { string code = 1; string device_label = 2; }
message PairResponse { string status = 1; string cert_pem = 2; }

message HealReport {
  uint64 pruned_logs = 1;
  uint64 pruned_activity = 2;
  uint64 evicted_embeddings = 3;
  uint64 healed_tasks = 4;
  repeated string warnings = 5;
}

message SettingKey { string key = 1; }
message SettingMutation { string key = 1; string value = 2; }
message SettingEntry { string key = 1; string value = 2; string category = 3; }
message SettingsSnapshot { repeated SettingEntry entries = 1; }

message SessionList {
  repeated SessionSummary sessions = 1;
}
message SessionSummary {
  string id = 1;
  string title = 2;
  uint64 message_count = 3;
  uint64 updated_unix_ts = 4;
}
message SessionRef { string id = 1; }
message SessionDetail {
  string id = 1;
  string title = 2;
  repeated MessageView messages = 3;
}
message MessageView {
  string role = 1;
  string text = 2;
  uint64 unix_ts = 3;
}

// Projects.
message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  uint64 created_at = 5;
  uint64 updated_at = 6;
}
message ProjectList { repeated Project projects = 1; }
message ProjectRef { string id = 1; }
message ProjectCreate { string name = 1; string description = 2; }
message ProjectUpdate {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
}

// Scheduled tasks.
message ScheduledTask {
  string id = 1;
  string name = 2;
  string prompt = 3;
  string schedule_type = 4;
  string schedule_expr = 5;
  string timezone = 6;
  string status = 7;
  int64 next_run_unix = 8; // 0 = none
  uint64 created_at = 9;
  string task_type = 10; // "prompt" or "command"
  string delivery_channel = 11;
  string delivery_target = 12;
}
message ScheduledTaskList { repeated ScheduledTask tasks = 1; }
message ScheduledTaskRef { string id = 1; }
message ScheduledTaskCreate {
  string name = 1;
  string prompt = 2;
  string schedule_type = 3;
  string schedule_expr = 4;
  string timezone = 5;
  string task_type = 6;
  string delivery_channel = 7;
  string delivery_target = 8;
}

// Pairing.
message PairingFilter { string channel_name = 1; } // empty = all
message PairingRequest {
  string id = 1;
  string channel_name = 2;
  string sender_id = 3;
  string code = 4;
  string status = 5;
  string display_name = 6;
  uint64 created_at = 7;
  uint64 expires_at = 8;
}
message PairingRequestList { repeated PairingRequest requests = 1; }
message PairingApproval { string channel_name = 1; string code = 2; }
message ApprovedSender {
  int64 id = 1;
  string channel_name = 2;
  string sender_id = 3;
  string display_name = 4;
  uint64 approved_at = 5;
}
message ApprovedSenderList { repeated ApprovedSender senders = 1; }
message ApprovedSenderRef { string channel_name = 1; string sender_id = 2; }

// Daemon status snapshot — what the TUI's status popup shows.
message DaemonStatus {
  string version = 1;
  uint64 uptime_secs = 2;
  uint64 live_session_count = 3;
  string llm_provider = 4;
  string llm_model = 5;
  uint64 active_tasks = 6;
  uint64 paused_tasks = 7;
  uint64 pending_pairings = 8;
}
