[package]
name = "gateway"
description = "Webhook gateway for messaging channel integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cortex = { path = "../cortex" }
plugins = { path = "../plugins" }
sandbox = { path = "../sandbox" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
libsql = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = "0.4"
subtle = "2.6"
regex = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
sha1 = "0.11"
serde_urlencoded = "0.7"
base64 = { workspace = true }
ed25519-dalek = { version = "2", features = ["std"] }
url = "2"
scraper = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
async-stream = "0.3"
opentelemetry = { workspace = true }
# Discord voice channels — Opus + RTP + libsodium under songbird's Driver.
# Off by default; the audio stack adds ~30 transitive crates and is only
# useful when borg is deployed against a Discord server with voice usage.
# Enable with `cargo build -p gateway --features discord-voice-channels`.
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "rustls", "receive", "tungstenite"], optional = true }
hound = { version = "3.5", optional = true }

[features]
# Bundles the songbird Discord voice driver — opt-in because the dep
# tree is heavy and only meaningful for operators who run borg in a
# Discord guild with active voice channels.
discord-voice-channels = ["dep:songbird", "dep:hound"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
wiremock = "0.6"
tracing-subscriber = { workspace = true }

[lints]
workspace = true
