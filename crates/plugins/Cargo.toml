[package]
name = "plugins"
description = "Integration marketplace: curated plugins for messaging, email, and productivity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }
libsql = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
keyring = { workspace = true }
ed25519-dalek = { workspace = true }
wasmparser = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wasm-encoder = "0.244"
# Watchdog timeout for wasmtime-driven tests. Without this, a hung
# test (e.g. an EpochTimer drop racing with the ticker thread) blocks
# `cargo test` indefinitely instead of failing the offending test.
ntest = "0.9"

[lints]
workspace = true
