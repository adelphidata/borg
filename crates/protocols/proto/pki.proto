syntax = "proto3";

package borg.pki.v1;

// Pki — internal-CA, pairing, and audit-chain RPCs. Lives in its own
// service (and its own .proto) to keep mTLS-required RPCs isolated from
// the looser admin surface. mTLS-required for every RPC.
service Pki {
  // Mints a fresh PAKE code, persists `sha256(code)` to `pairing_codes`, and
  // returns the plaintext code to the caller. The actual SPAKE2 exchange runs
  // over a separate plaintext bootstrap UDS socket — see borgd pairing module.
  rpc StartPairing(StartPairingRequest) returns (StartPairingResponse);

  // Renew a client cert that's ≤14d from expiry. Requires the renewing
  // device's mTLS cert; the server verifies the active cert's fingerprint
  // matches `request.fingerprint` before issuing.
  rpc RenewCert(RenewCertRequest) returns (RenewCertResponse);

  // Revoke a paired device's fingerprint and add it to `revoked_fingerprints`.
  rpc RevokeDevice(RevokeDeviceRequest) returns (PkiEmpty);

  rpc ListPairedDevices(PkiEmpty) returns (PairedDeviceList);

  // Replay the audit chain. Pure (no clock, no network) — deterministic
  // forensic verification.
  rpc VerifyAuditChain(PkiEmpty) returns (VerifyAuditResponse);

  // Inspect the calling device's cert lifecycle so the client can
  // self-trigger a `RenewCert` when its cert is within the 14-day renewal
  // window. Requires mTLS — the daemon answers based on the principal's
  // own active cert (request body intentionally empty).
  rpc GetCertLifecycle(PkiEmpty) returns (CertLifecycleResponse);
}

message PkiEmpty {}

message StartPairingRequest {
  string device_label = 1;
}

message StartPairingResponse {
  string code = 1;
  int64 expires_at = 2;
}

message RenewCertRequest {
  string fingerprint = 1;
}

message RenewCertResponse {
  string new_cert_pem = 1;
  string new_key_pkcs8_pem = 2;
  int64 not_after = 3;
}

message RevokeDeviceRequest {
  string fingerprint = 1;
  string reason = 2;
}

message PairedDevice {
  int64 id = 1;
  string fingerprint = 2;
  string device_label = 3;
  int64 paired_at = 4;
  int64 last_seen_at = 5;
  string status = 6;
  string principal_id = 7;
}

message PairedDeviceList {
  repeated PairedDevice devices = 1;
}

message CertLifecycleResponse {
  // Active cert's `not_after`, UNIX seconds. Zero if no active cert is
  // associated with the calling principal (shouldn't happen for an
  // mTLS-authenticated request).
  int64 not_after = 1;
  // True when the active cert is within the 14-day silent-renewal window.
  // The client should call `RenewCert` opportunistically when this flips
  // to true.
  bool renewal_due = 2;
}

message VerifyAuditResponse {
  // "ok" | "ok_with_tombstones" | "tampered"
  string outcome = 1;
  // Populated when outcome == "tampered". -1 otherwise.
  int64 tampered_seq = 2;
  // Populated when outcome == "ok_with_tombstones". 0 otherwise.
  int64 tombstone_count = 3;
}
