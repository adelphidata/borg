syntax = "proto3";

package borg.session.v1;

// Session is the per-conversation surface. One agent runs per session_id;
// multiple clients may subscribe to the same session's event stream.
service Session {
  // Open a new session or resume an existing one. Returns session_id.
  rpc Open(OpenRequest) returns (OpenResponse);

  // Send a user message and receive the resulting AgentEvent stream for this turn.
  // Closes when the agent emits TurnComplete or Error.
  rpc Send(SendRequest) returns (stream AgentEvent);

  // Subscribe to a session's event stream from a given cursor.
  // Used by additional clients (multi-TUI) and for resume-after-disconnect.
  rpc Stream(StreamRequest) returns (stream AgentEvent);

  // Cancel the in-flight turn for a session.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // Close the session and flush state.
  rpc Close(CloseRequest) returns (CloseResponse);

  // Reply to a ShellConfirmation or UserInputRequest, identified by prompt_id.
  rpc RespondToPrompt(PromptResponse) returns (Empty);

  // Inspect agent/session state (title, model, message count, plan, etc.)
  // — replaces direct `agent.session()` / `agent.config()` reads from the TUI.
  rpc GetState(SessionStateRequest) returns (SessionState);

  // History operations on the active agent.
  rpc Compact(CompactRequest) returns (CompactResponse);
  rpc ClearHistory(ClearRequest) returns (Empty);
  rpc Undo(UndoRequest) returns (UndoResponse);
  rpc RewindToNthUserMessage(RewindRequest) returns (RewindResponse);
  rpc AutoSave(AutoSaveRequest) returns (Empty);

  // Lifecycle on the underlying agent (separate from the gRPC session id).
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse);
  rpc LoadSession(LoadSessionRequest) returns (LoadSessionResponse);

  // Fork the active agent session at its last message. Daemon owns the
  // single SQLite writer, so this must run in the daemon — TUI cannot open
  // the DB directly without violating the single-writer invariant.
  rpc Fork(ForkRequest) returns (ForkResponse);

  // Push a steer message into a running turn.
  rpc Steer(SteerRequest) returns (Empty);

  // Append a system-injected assistant message into the session's history.
  // Used to mirror proactive deliveries (e.g. a heartbeat the daemon
  // streamed to the TUI) into the active session so the agent has them
  // in context when the user replies.
  rpc AppendAssistantMessage(AppendAssistantMessageRequest) returns (Empty);
}

message Empty {}

message OpenRequest {
  // Optional resume_id — if set, daemon resumes that session's history.
  string resume_id = 1;
}

message OpenResponse {
  string session_id = 1;
  // Last event_seq currently buffered for this session (0 for new).
  uint64 last_event_seq = 2;
}

message SendRequest {
  string session_id = 1;
  string text = 2;
  // Optional multimodal attachments. Empty = text-only turn.
  repeated InlineImage images = 3;
}

message InlineImage {
  string mime_type = 1;
  bytes data = 2; // raw bytes, NOT base64
  string filename = 3; // optional
}

message StreamRequest {
  string session_id = 1;
  // Resume cursor. Zero replays from start of in-memory ring buffer.
  uint64 since_event_seq = 2;
}

message CancelRequest { string session_id = 1; }
message CancelResponse {}

message CloseRequest { string session_id = 1; }
message CloseResponse {}

message PromptResponse {
  string session_id = 1;
  string prompt_id = 2;
  // For ShellConfirmation: "true" or "false". For UserInputRequest: the chosen text.
  string value = 3;
}

// AgentEvent mirrors core::agent::AgentEvent. Each event carries a per-session
// monotonic sequence number for resume support.
message AgentEvent {
  uint64 event_seq = 1;
  oneof kind {
    TextDelta text_delta = 10;
    ThinkingDelta thinking_delta = 11;
    ToolExecuting tool_executing = 12;
    ToolResult tool_result = 13;
    ShellConfirmation shell_confirmation = 14;
    ToolOutputDelta tool_output_delta = 15;
    Usage usage = 16;
    SubAgentUpdate sub_agent_update = 17;
    SteerReceived steer_received = 18;
    PlanUpdated plan_updated = 19;
    UserInputRequest user_input_request = 20;
    Preparing preparing = 21;
    TurnComplete turn_complete = 22;
    HistoryCompacted history_compacted = 23;
    ErrorEvent error = 24;
    SystemNotice system_notice = 25;
  }
}

message TextDelta { string text = 1; }
message ThinkingDelta { string text = 1; }
message ToolExecuting {
  string tool_call_id = 1;
  string name = 2;
  string args_json = 3;
}
message ToolResult {
  string tool_call_id = 1;
  string name = 2;
  string result = 3;
}
message ShellConfirmation {
  string command = 1;
  // Client must reply via RespondToPrompt with this id.
  string prompt_id = 2;
}
message ToolOutputDelta {
  string tool_call_id = 1;
  string name = 2;
  string delta = 3;
  bool is_stderr = 4;
}
message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_creation_tokens = 4;
}
message SubAgentUpdate { string agent_id = 1; string nickname = 2; string status = 3; }
message SteerReceived { string text = 1; }
message PlanStep { string id = 1; string text = 2; string status = 3; }
message PlanUpdated { repeated PlanStep steps = 1; }
// A single question option in a batched UserInputRequest. The UI auto-appends
// an "Other" free-form row, so the model never includes it explicitly.
message UserInputQuestionOption { string label = 1; string description = 2; }
// One question in a UserInputRequest batch.
message UserInputQuestion {
  string id = 1;            // snake_case stable id
  string header = 2;        // ≤12 char chip label
  string question = 3;      // one-sentence prompt
  bool multi_select = 4;    // allow multiple selections
  repeated UserInputQuestionOption options = 5;
}
message UserInputRequest {
  // Numbers 1-3 were a legacy single-question shape (prompt/choices/allow_custom)
  // that no client ever shipped consuming. Reserved so the slots can't be
  // accidentally reused with incompatible semantics.
  reserved 1, 2, 3;
  reserved "prompt", "choices", "allow_custom";
  string prompt_id = 4;
  // The response (RespondToPrompt.value) is the JSON
  // `{ "<qid>": { "answers": [...] } }` map, in question order.
  repeated UserInputQuestion questions = 5;
}
message Preparing {}
message TurnComplete {}
message HistoryCompacted {
  uint64 dropped = 1;
  uint64 before_tokens = 2;
  uint64 after_tokens = 3;
  bool iterative = 4;
}
message ErrorEvent { string message = 1; }
// Out-of-band notice from the daemon (posture transitions, budget alerts, …)
// — not part of the LLM stream; clients render as a system cell / toast.
message SystemNotice {
  string category = 1; // e.g. "posture", "budget"
  string text = 2;
}

// ── Agent-control messages ──────────────────────────────────────────────

message SessionStateRequest { string session_id = 1; }
message SessionState {
  string session_id = 1;
  string agent_session_id = 2; // borg_core Session.meta.id (for resume)
  string title = 3;
  uint64 message_count = 4;
  uint64 user_message_count = 5;
  uint64 token_estimate = 6;
  string llm_provider = 7;
  string llm_model = 8;
  string collab_mode = 9;
  bool turn_in_flight = 10;
}

message CompactRequest { string session_id = 1; }
message CompactResponse { uint64 dropped = 1; uint64 after_tokens = 2; }

message ClearRequest { string session_id = 1; }

message UndoRequest { string session_id = 1; }
message UndoResponse { uint64 removed = 1; }

message RewindRequest { string session_id = 1; uint64 n = 2; }
message RewindResponse { uint64 removed = 1; }

message AutoSaveRequest { string session_id = 1; }

message NewSessionRequest { string session_id = 1; }
message NewSessionResponse { string agent_session_id = 1; }

message LoadSessionRequest { string session_id = 1; string agent_session_id = 2; }
message LoadSessionResponse { string agent_session_id = 1; uint64 message_count = 2; }

message SteerRequest { string session_id = 1; string text = 2; }

message AppendAssistantMessageRequest {
  string session_id = 1;
  string content = 2;
}

message ForkRequest { string session_id = 1; }
message ForkResponse {
  string forked_agent_session_id = 1;
  string title = 2;
  uint64 message_count = 3;
}
