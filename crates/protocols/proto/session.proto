syntax = "proto3";

package borg.session.v1;

// Session is the per-conversation surface. One agent runs per session_id;
// multiple clients may subscribe to the same session's event stream.
service Session {
  // Open a new session or resume an existing one. Returns session_id.
  rpc Open(OpenRequest) returns (OpenResponse);

  // Send a user message and receive the resulting AgentEvent stream for this turn.
  // Closes when the agent emits TurnComplete or Error.
  rpc Send(SendRequest) returns (stream AgentEvent);

  // ACP-specific bidi turn stream. Used only by `borg acp` so daemon-side
  // tools can request IDE text-buffer reads/writes during the turn.
  rpc AcpTurn(stream AcpClientMessage) returns (stream AcpServerMessage);

  // Subscribe to a session's event stream from a given cursor.
  // Used by additional clients (multi-TUI) and for resume-after-disconnect.
  rpc Stream(StreamRequest) returns (stream AgentEvent);

  // Cancel the in-flight turn for a session.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // Close the session and flush state.
  rpc Close(CloseRequest) returns (CloseResponse);

  // Reply to a ShellConfirmation or UserInputRequest, identified by prompt_id.
  rpc RespondToPrompt(PromptResponse) returns (Empty);

  // Inspect agent/session state (title, model, message count, plan, etc.)
  // — replaces direct `agent.session()` / `agent.config()` reads from the TUI.
  rpc GetState(SessionStateRequest) returns (SessionState);

  // Component-level context-window usage for the active agent (system
  // prompt, tool schemas, history, free space). On-demand — powers /context.
  rpc GetContextBreakdown(SessionStateRequest) returns (ContextBreakdown);

  // History operations on the active agent.
  rpc Compact(CompactRequest) returns (CompactResponse);
  rpc ClearHistory(ClearRequest) returns (Empty);
  rpc Undo(UndoRequest) returns (UndoResponse);
  // Put the files of the session's workspace back to an undo point, or
  // list the points. Files only: the conversation is not rewound (that is
  // `Undo`). Refused, with the reason in `report`, while a turn runs.
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc RewindToNthUserMessage(RewindRequest) returns (RewindResponse);
  rpc AutoSave(AutoSaveRequest) returns (Empty);

  // Lifecycle on the underlying agent (separate from the gRPC session id).
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse);
  rpc LoadSession(LoadSessionRequest) returns (LoadSessionResponse);

  // Fork the active agent session at its last message. Daemon owns the
  // single SQLite writer, so this must run in the daemon — TUI cannot open
  // the DB directly without violating the single-writer invariant.
  rpc Fork(ForkRequest) returns (ForkResponse);

  // Push a steer message into a running turn.
  rpc Steer(SteerRequest) returns (Empty);

  // Append a system-injected assistant message into the session's history.
  // Used to mirror proactive deliveries (e.g. a heartbeat the daemon
  // streamed to the TUI) into the active session so the agent has them
  // in context when the user replies.
  rpc AppendAssistantMessage(AppendAssistantMessageRequest) returns (Empty);

  // Execute a shell command in the session's context with no LLM turn.
  //
  // Runs the same ExecutionPolicy + control-plane + sandboxed-spawn path as
  // the `run_shell` tool — the daemon is where that machinery lives, so this
  // inherits it by construction rather than by duplicating it client-side.
  // The result is appended to session history so the next turn has it.
  rpc ExecShell(ExecShellRequest) returns (ExecShellResponse);

  // Paths under the session's workspace matching a prefix, for a client that
  // wants to offer file completions.
  //
  // Scoped to the workspace and filtered by `[security] blocked_paths`, the
  // same rules `fs_read` and `list_dir` answer to. A completion menu that
  // names a file the agent may not read is a leak with a nice interface.
  rpc ListPaths(ListPathsRequest) returns (PathList);
}

message Empty {}

message OpenRequest {
  // Optional resume_id — if set, daemon resumes that session's history.
  string resume_id = 1;
  // Optional workspace context for session-scoped execution. A session
  // given one is confined to `workspace_root`.
  string workspace_cwd = 2;
  string workspace_root = 3;
  bool enforce_workspace_root = 4;
  // The folder the session works in, without confinement: relative paths
  // and the shell start there, project instructions are read from it, and
  // undo points cover it. An absolute path to an existing directory.
  // Ignored when a workspace context is given. Empty: the daemon chooses —
  // the folder a resumed session last worked in, else the
  // `conversation.default_folder` setting, else its own directory.
  string working_dir = 5;
}

message OpenResponse {
  string session_id = 1;
  // Last event_seq currently buffered for this session (0 for new).
  uint64 last_event_seq = 2;
  // The folder the session works in: where its relative paths resolve and
  // what its undo points cover. A resumed session that is still live keeps
  // the folder it has, whatever the request named, so a client reads it here
  // rather than assuming its own. Empty from a daemon without the field.
  string working_dir = 3;
}

message SendRequest {
  string session_id = 1;
  string text = 2;
  // Optional multimodal attachments. Empty = text-only turn.
  repeated InlineImage images = 3;
  // Optional text documents. Reach the model as labelled text inside the
  // untrusted-content boundary, because the content model has no document
  // part. Non-text bytes are refused daemon-side.
  repeated InlineDocument documents = 4;
  // Resume the turn that was cut short instead of starting a new one. The
  // agent continues from its own partial reply; `text`, `images`, and
  // `documents` must be empty.
  bool resume_interrupted = 5;
}

message InlineDocument {
  string filename = 1;
  string mime_type = 2;
  bytes content = 3; // raw bytes, NOT base64
}

message InlineImage {
  string mime_type = 1;
  bytes data = 2; // raw bytes, NOT base64
  string filename = 3; // optional
}

message AcpFsCapabilities {
  bool read_text_file = 1;
  bool write_text_file = 2;
}

message AcpStartTurn {
  string session_id = 1;
  string text = 2;
  repeated InlineImage images = 3;
  AcpFsCapabilities fs_capabilities = 4;
}

// In-stream cancel signal. Borg's own ACP client uses the unary `Cancel` RPC
// instead — it's simpler and idempotent. This variant remains so
// external ACP clients that prefer keeping cancellation on the same bidi
// stream as the turn can do so; the daemon honors both paths identically.
message AcpCancel {
  string session_id = 1;
}

message AcpReadTextFileRequest {
  string path = 1;
}

message AcpWriteTextFileRequest {
  string path = 1;
  string content = 2;
}

message AcpFsRequest {
  string request_id = 1;
  oneof kind {
    AcpReadTextFileRequest read_text_file = 2;
    AcpWriteTextFileRequest write_text_file = 3;
  }
}

message AcpReadTextFileResponse {
  string content = 1;
}

message AcpWriteTextFileResponse {}

message AcpFsError {
  string message = 1;
}

message AcpFsResponse {
  string request_id = 1;
  oneof kind {
    AcpReadTextFileResponse read_text_file = 2;
    AcpWriteTextFileResponse write_text_file = 3;
    AcpFsError error = 4;
  }
}

message AcpClientMessage {
  oneof kind {
    AcpStartTurn start_turn = 1;
    AcpFsResponse fs_response = 2;
    AcpCancel cancel = 3;
  }
}

message AcpServerMessage {
  oneof kind {
    AgentEvent agent_event = 1;
    AcpFsRequest fs_request = 2;
  }
}

message StreamRequest {
  string session_id = 1;
  // Resume cursor. Zero replays from start of in-memory ring buffer.
  uint64 since_event_seq = 2;
}

message CancelRequest { string session_id = 1; }
message CancelResponse {}

message CloseRequest { string session_id = 1; }
message CloseResponse {}

message PromptResponse {
  string session_id = 1;
  string prompt_id = 2;
  // For ShellConfirmation: "true" or "false". For UserInputRequest: the chosen text.
  string value = 3;
}

// AgentEvent mirrors core::agent::AgentEvent. Each event carries a per-session
// monotonic sequence number for resume support.
message AgentEvent {
  uint64 event_seq = 1;
  oneof kind {
    TextDelta text_delta = 10;
    ThinkingDelta thinking_delta = 11;
    ToolExecuting tool_executing = 12;
    ToolResult tool_result = 13;
    ShellConfirmation shell_confirmation = 14;
    ToolOutputDelta tool_output_delta = 15;
    Usage usage = 16;
    SubAgentUpdate sub_agent_update = 17;
    SteerReceived steer_received = 18;
    PlanUpdated plan_updated = 19;
    UserInputRequest user_input_request = 20;
    Preparing preparing = 21;
    TurnComplete turn_complete = 22;
    HistoryCompacted history_compacted = 23;
    ErrorEvent error = 24;
    SystemNotice system_notice = 25;
    TextRetracted text_retracted = 26;
  }
}

message TextDelta { string text = 1; }
// The agent discarded text that it already sent as TextDelta: the LLM
// attempt that produced it failed, and a new attempt sends the full response
// again. `bytes` is the UTF-8 length of the discarded deltas. A client
// removes that many bytes from the end of the assistant text that it
// accumulates for the turn, cuts on a character boundary, and accepts a
// count larger than the text that it holds.
message TextRetracted { uint64 bytes = 1; }
message ThinkingDelta { string text = 1; }
message ToolExecuting {
  string tool_call_id = 1;
  string name = 2;
  string args_json = 3;
}
message ToolResult {
  string tool_call_id = 1;
  string name = 2;
  string result = 3;
  // Previews of images the tool returned (a computer_use screenshot), sized
  // for the transcript. The model's copy travels in the tool-result message.
  repeated ToolResultImage images = 4;
}
message ToolResultImage {
  string mime_type = 1;
  string data_base64 = 2;
}
message ShellConfirmation {
  string command = 1;
  // Client must reply via RespondToPrompt with this id.
  string prompt_id = 2;
}
message ToolOutputDelta {
  string tool_call_id = 1;
  string name = 2;
  string delta = 3;
  bool is_stderr = 4;
}
message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_creation_tokens = 4;
}
message SubAgentUpdate { string agent_id = 1; string nickname = 2; string status = 3; }
message SteerReceived { string text = 1; }
message PlanStep { string id = 1; string text = 2; string status = 3; }
message PlanUpdated { repeated PlanStep steps = 1; }
// A single question option in a batched UserInputRequest. The UI auto-appends
// an "Other" free-form row, so the model never includes it explicitly.
message UserInputQuestionOption { string label = 1; string description = 2; }
// One question in a UserInputRequest batch.
message UserInputQuestion {
  string id = 1;            // snake_case stable id
  string header = 2;        // ≤12 char chip label
  string question = 3;      // one-sentence prompt
  bool multi_select = 4;    // allow multiple selections
  repeated UserInputQuestionOption options = 5;
}
message UserInputRequest {
  // Numbers 1-3 were a legacy single-question shape (prompt/choices/allow_custom)
  // that no client ever shipped consuming. Reserved so the slots can't be
  // accidentally reused with incompatible semantics.
  reserved 1, 2, 3;
  reserved "prompt", "choices", "allow_custom";
  string prompt_id = 4;
  // The response (RespondToPrompt.value) is the JSON
  // `{ "<qid>": { "answers": [...] } }` map, in question order.
  repeated UserInputQuestion questions = 5;
}
message Preparing {}
message TurnComplete {}
message HistoryCompacted {
  uint64 dropped = 1;
  uint64 before_tokens = 2;
  uint64 after_tokens = 3;
  bool iterative = 4;
}
message ErrorEvent { string message = 1; }
// Out-of-band notice from the daemon (posture transitions, budget alerts, …)
// — not part of the LLM stream; clients render as a system cell / toast.
message SystemNotice {
  // e.g. "posture", "budget". "reconnecting" and "rate-limited" describe a
  // wait (the provider dropped, or asked the client to back off) rather than
  // an event; a surface replaces one with the next and clears it when the
  // turn moves again.
  string category = 1;
  string text = 2;
}

message SessionStateRequest { string session_id = 1; }
message SessionState {
  string session_id = 1;
  string agent_session_id = 2; // borg_core Session.meta.id (for resume)
  string title = 3;
  uint64 message_count = 4;
  uint64 user_message_count = 5;
  uint64 token_estimate = 6;
  string llm_provider = 7;
  string llm_model = 8;
  string collab_mode = 9;
  bool turn_in_flight = 10;
}

message ContextComponent {
  string label = 1;
  uint64 tokens = 2;
  // True for a child/detail row itemizing part of the nearest preceding
  // non-detail component (e.g. one skill, or one MCP server). Display-only:
  // its tokens are already counted in the parent, so totals must skip it.
  bool detail = 3;
}

message ContextBreakdown {
  uint64 context_window = 1;
  repeated ContextComponent components = 2;
}

message CompactRequest { string session_id = 1; }
// Estimated history size before and after. Equal when there was nothing
// worth summarising yet.
message CompactResponse { uint64 before_tokens = 1; uint64 after_tokens = 2; }

message ClearRequest { string session_id = 1; }

message UndoRequest { string session_id = 1; }
message UndoResponse { uint64 removed = 1; }

message RollbackRequest {
  string session_id = 1;
  // The undo point to go back to: its number in the list, where 1 is the
  // most recent. 0 picks the most recent one that differs from the files
  // as they are.
  uint32 point = 2;
  // List the undo points and change nothing.
  bool list_only = 3;
}

// A state the workspace files can be put back to.
message UndoPoint {
  uint32 number = 1;
  // When it was taken, unix seconds.
  int64 created_at = 2;
  // First line of the message that started the turn it precedes. Empty
  // when that is not known.
  string prompt = 3;
  // True for the files as an earlier rollback found them.
  bool before_rollback = 4;
  // How many files differ between this point and the files as they are.
  uint32 differing_files = 5;
  // True when the conversation holds nothing after the message that
  // started the turn it precedes: the turn's work was undone or rewound,
  // while its file changes may still be on disk.
  bool turn_undone = 6;
}

message RollbackResponse {
  // What happened, in plain words, ready to show as it is.
  string report = 1;
  // True when files were changed.
  bool changed = 2;
  // The undo points, newest first. Filled for `list_only`.
  repeated UndoPoint points = 3;
}

message RewindRequest { string session_id = 1; uint64 n = 2; }
message RewindResponse { uint64 removed = 1; }

message AutoSaveRequest { string session_id = 1; }

message NewSessionRequest { string session_id = 1; }
message NewSessionResponse { string agent_session_id = 1; }

message LoadSessionRequest { string session_id = 1; string agent_session_id = 2; }
message LoadSessionResponse { string agent_session_id = 1; uint64 message_count = 2; }

message SteerRequest { string session_id = 1; string text = 2; }

message AppendAssistantMessageRequest {
  string session_id = 1;
  string content = 2;
}

message ExecShellRequest {
  string session_id = 1;
  string command = 2;
  uint64 timeout_ms = 3;
}

message ExecShellResponse {
  string output = 1;
  int32 exit_code = 2;
  // True when the command was refused by policy rather than executed.
  bool denied = 3;
}

message ListPathsRequest {
  string session_id = 1;
  // What the user has typed so far, relative to the session's working
  // directory. A trailing `/` lists that directory. Empty lists the top level.
  string prefix = 2;
  // Most rows wanted. Clamped daemon-side; 0 means the daemon's own ceiling.
  uint32 limit = 3;
}

message PathEntry {
  // Relative to the session's working directory, with a trailing `/` on a
  // directory — spelled the way the user would type it.
  string path = 1;
  bool is_dir = 2;
}

message PathList { repeated PathEntry paths = 1; }

message ForkRequest { string session_id = 1; }
message ForkResponse {
  string forked_agent_session_id = 1;
  string title = 2;
  uint64 message_count = 3;
}
