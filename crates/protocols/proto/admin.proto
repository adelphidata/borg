syntax = "proto3";

package borg.admin.v1;

// Admin surfaces lifecycle, settings, and the data-access RPCs that replace
// direct DB reads from the TUI popups.
service Admin {
  rpc Poke(Empty) returns (Empty);
  rpc TriggerHeartbeat(TriggerHeartbeatRequest) returns (Empty);
  rpc Heal(Empty) returns (HealReport);
  rpc Dream(Empty) returns (DreamReport);
  rpc Shutdown(Empty) returns (Empty);

  // Settings.
  rpc GetSettings(Empty) returns (SettingsSnapshot);
  rpc SetSetting(SettingMutation) returns (Empty);
  rpc UnsetSetting(SettingKey) returns (Empty);

  // Sessions.
  rpc ListSessions(ListSessionsRequest) returns (SessionList);
  rpc GetSession(SessionRef) returns (SessionDetail);
  rpc SetSessionArchived(SessionArchiveMutation) returns (Empty);
  rpc SetSessionTitle(SessionTitleMutation) returns (Empty);
  // Live turn-activity feed across every session, so a listing can show which
  // conversation is working without polling each one. Deltas only — clients
  // reconcile against `ListSessions.turn_active` whenever the stream opens.
  rpc SubscribeSessionActivity(Empty) returns (stream SessionActivityEvent);

  // Scheduled tasks.
  rpc ListScheduledTasks(Empty) returns (ScheduledTaskList);
  rpc CreateScheduledTask(ScheduledTaskCreate) returns (ScheduledTask);
  rpc UpdateScheduledTask(ScheduledTaskUpdate) returns (ScheduledTask);
  rpc DeleteScheduledTask(ScheduledTaskRef) returns (Empty);
  rpc PauseScheduledTask(ScheduledTaskRef) returns (Empty);
  rpc ResumeScheduledTask(ScheduledTaskRef) returns (Empty);
  rpc RunScheduledTaskNow(ScheduledTaskRef) returns (Empty);
  rpc GetScheduledTaskRuns(GetScheduledTaskRunsRequest) returns (ScheduledTaskRunList);
  rpc GetScheduledTaskDetail(ScheduledTaskRef) returns (ScheduledTaskDetail);

  // Session export — renders one session via borg_core::export to bytes.
  rpc ExportSession(ExportSessionRequest) returns (ExportSessionResponse);

  // Ambient header status (the `class: …` line in the TUI header).
  rpc GetAmbientStatus(Empty) returns (AmbientStatus);

  // Persistent doctor warnings — latest doctor_runs row's persistent_warnings.
  rpc GetPersistentWarnings(Empty) returns (WarningList);

  // Skills the agent will actually load this run, so a client can show what
  // Borg knows how to do without reimplementing the loader's shadowing and
  // requirement rules.
  rpc ListSkills(Empty) returns (SkillList);

  // Pairing requests + approved senders.
  rpc ListPairingRequests(PairingFilter) returns (PairingRequestList);
  rpc ApprovePairing(PairingApproval) returns (Empty);
  rpc ListApprovedSenders(PairingFilter) returns (ApprovedSenderList);
  rpc RevokeApprovedSender(ApprovedSenderRef) returns (Empty);

  // Daemon-wide status snapshot (replaces several DB reads from the TUI).
  rpc GetDaemonStatus(Empty) returns (DaemonStatus);

  // Run a quick agent turn to deliver a personalized greeting to a newly
  // approved sender on the given channel. Fire-and-forget on the daemon side.
  rpc SendApprovalGreeting(ApprovalGreetingRequest) returns (Empty);

  // Subscribe to heartbeat lifecycle events from the daemon. The TUI uses
  // this to render heartbeat status without running its own scheduler.
  rpc SubscribeHeartbeatEvents(Empty) returns (stream HeartbeatEvent);

  // Append a row to `activity_log`. Replaces direct DB writes from cli.
  rpc LogActivity(LogActivityRequest) returns (Empty);

  // Render the recent activity_log tail as a single formatted string,
  // matching `borg_core::activity_log::format_activity_entry`. Used by the
  // TUI `/logs` command so the cli no longer opens the SQLite DB directly.
  rpc GetActivityLogText(ActivityLogQuery) returns (ActivityLogText);

  // Persist plugin install metadata in a single round-trip. The cli still
  // performs the on-disk install; this RPC writes the DB rows + file hashes.
  rpc PluginInstall(PluginInstallRequest) returns (PluginInstallResponse);

  // Onboarding sentinel — checks/sets the `onboarded` settings-table flag
  // so the cli wizard knows whether first-run is complete.
  rpc GetOnboardingState(Empty) returns (OnboardingState);
  rpc SetOnboardingComplete(Empty) returns (Empty);
  // Everything a first-run screen needs in one round trip: the provider
  // catalog with curated models, what is configured now, and the credentials
  // the daemon can already see on this machine without being told.
  rpc GetSetupStatus(Empty) returns (SetupStatus);

  // Per-provider API key routing — the daemon stores routing metadata
  // (literal value vs. keychain ref); the cli does the keychain I/O.
  rpc GetApiKey(ApiKeyRef) returns (ApiKeyValue);
  rpc SetApiKey(ApiKeyValue) returns (Empty);
  rpc UnsetApiKey(ApiKeyRef) returns (Empty);
  rpc ListApiKeys(Empty) returns (ApiKeyList);

  // Token-budget aggregates used by the TUI `/usage` view. Replaces direct
  // DB reads from the cli.
  rpc GetMonthlyTokenTotal(Empty) returns (MonthlyTokenTotal);
  rpc GetMonthlyTotalCost(Empty) returns (MonthlyTotalCost);

  // BYO providers — writer-only RPCs. Reads can use Database::open_readonly.
  rpc AddProvider(AddProviderRequest) returns (Empty);
  rpc RemoveProvider(RemoveProviderRequest) returns (Empty);

  // Generic webhook definitions — writer-only RPCs.
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc RevokeWebhook(WebhookRef) returns (Empty);

  // Bearer client tokens — writer-only RPCs. Issue returns the plaintext
  // token exactly once; the daemon stores only its hash.
  rpc IssueClientToken(IssueClientTokenRequest) returns (IssueClientTokenResponse);
  rpc RevokeClientToken(ClientTokenRef) returns (RevokedClientToken);

  // Doctor squelch CRUD — writer-only. Reads can use Database::open_readonly.
  rpc DoctorSquelchSet(DoctorSquelchSetRequest) returns (Empty);
  rpc DoctorSquelchClear(DoctorSquelchClearRequest) returns (DoctorSquelchClearResponse);

  // Credential pool admin. Per-provider rotation across multiple API keys with
  // cooldown TTL on 402/429 and selectable strategy. Backs `borg auth …`.
  rpc ListCredentials(ListCredentialsRequest) returns (CredentialList);
  rpc AddCredential(AddCredentialRequest) returns (CredentialEntry);
  rpc RemoveCredential(RemoveCredentialRequest) returns (CredentialEntry);
  rpc ResetCredentials(ResetCredentialsRequest) returns (ResetCredentialsResponse);
  rpc SetCredentialStrategy(SetCredentialStrategyRequest) returns (Empty);
  // Move one credential to a 1-based position in the pool's priority order
  // and renumber the rest contiguously. Backs `borg auth priority …`.
  rpc SetCredentialPriority(SetCredentialPriorityRequest) returns (SetCredentialPriorityResponse);
  // OAuth pairing — runs the credential-source discoverer for `kind` against
  // the daemon's home directory and seeds whatever it finds into the pool.
  rpc PairCredential(PairCredentialRequest) returns (PairCredentialResponse);

  // Per-session goal (Ralph-loop objective). The TUI's `/goal …` command
  // talks to these RPCs; the daemon owns the SQLite row and the broadcast
  // bus so any subscriber (TUI footer today, replicated dashboards later)
  // reacts to mutations without polling.
  rpc GetGoal(GoalRef) returns (GoalDetail);
  rpc SetGoal(GoalMutation) returns (GoalDetail);
  rpc ClearGoal(GoalRef) returns (Empty);
  rpc PauseGoalOnInterrupt(GoalRef) returns (GoalDetail);
  rpc SubscribeGoalEvents(Empty) returns (stream GoalEvent);
  rpc MutateGoalGates(GoalGateMutation) returns (GoalGateList);
  rpc MutateSessionHeartbeat(SessionHeartbeatMutation) returns (SessionHeartbeatDetail);

  // Public-internet tunnel — start/stop/status. The daemon owns the
  // long-running provider (cloudflared / ngrok / tailscale / custom) under
  // `spawn_supervised`; the cli is a thin client over these RPCs.
  rpc TunnelStart(Empty) returns (TunnelStatusReply);
  rpc TunnelStop(Empty) returns (Empty);
  rpc TunnelStatus(Empty) returns (TunnelStatusReply);

  // Subprocess registry — daemon-side ProcessRegistry inspection + pinning.
  // `GetSubprocesses` returns a snapshot of running + recently-finished
  // entries; `SetSubprocessPinned` flips the auto-reap pin on a specific
  // running entry (the TUI subprocess view drives both).
  rpc GetSubprocesses(Empty) returns (SubprocessSnapshot);
  rpc SetSubprocessPinned(SetSubprocessPinnedRequest) returns (Empty);

  // Cross-platform session handoff. The state machine lives on the
  // `sessions` row (None → pending → running → completed | failed). CLI /
  // TUI initiates via RequestHandoff; the destination gateway claims with
  // ClaimHandoff and finalizes with CompleteHandoff or FailHandoff.
  rpc RequestHandoff(HandoffRequest) returns (Empty);
  rpc ClaimHandoff(HandoffClaimRequest) returns (HandoffClaimResponse);
  rpc CompleteHandoff(SessionRef) returns (Empty);
  rpc FailHandoff(HandoffFailRequest) returns (Empty);
  rpc GetHandoffStatus(SessionRef) returns (HandoffStatusReply);

  // Browser CDP attach — `/browser connect|disconnect|status` and
  // `borg browser …` both route through this single RPC so the URL
  // parsing + reachability probe + DB-settings persistence live in one
  // place. When `cdp_url` is set, the browser tool calls
  // `chromiumoxide::Browser::connect(url)` instead of launching its own
  // headless Chrome; this lets the agent share the user's live profile.
  rpc BrowserManage(BrowserManageRequest) returns (BrowserManageResponse);

  // Hot-reload MCP catalog and/or user skills without restarting the daemon.
  // `target=ALL` reloads both; `MCP` / `SKILLS` target one subsystem.
  rpc Reload(ReloadRequest) returns (ReloadResponse);

  // Sub-agent control — backs `/agents` (TUI popup) and `borg agents …`
  // (CLI). The daemon owns the in-memory `AgentControl` registry and the
  // `AgentTreeBus`; mutating RPCs delegate to the live registry, list ops
  // also surface terminal agents persisted in `sub_agent_runs`.
  rpc ListAgents(AgentListRequest) returns (AgentList);
  rpc KillAgent(AgentRef) returns (Empty);
  rpc KillAgentSubtree(AgentRef) returns (Empty);
  rpc PauseAgent(AgentRef) returns (Empty);
  rpc ResumeAgent(AgentRef) returns (Empty);
  rpc SubscribeAgentTreeEvents(SessionRef) returns (stream AgentTreeEvent);
  rpc ListAgentSnapshots(SessionRef) returns (AgentSnapshotList);
  rpc GetAgentSnapshot(AgentSnapshotRefRequest) returns (AgentList);
}

// Sub-agent control messages

message AgentRef {
  string agent_id = 1;
}

message AgentListRequest {
  // Owning session id. Empty string means "active session" — the daemon
  // resolves it from the live registry. Explicit value lets the CLI page
  // through historical sessions.
  string session_id = 1;
}

message AgentMetrics {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 reasoning_tokens = 3;
  double cost_usd = 4;
  uint64 tool_calls = 5;
  // De-duplicated file paths this agent has touched (read or written).
  repeated string files_touched = 6;
}

message AgentEntry {
  string id = 1;
  string nickname = 2;
  string role = 3;
  string model = 4;
  string parent_session_id = 5;
  string session_id = 6;
  uint32 depth = 7;
  // Stable wire string: pending_init | running | paused | completed | errored | shutdown
  string status = 8;
  int64 created_at = 9;
  // Set only when the agent has reached a terminal state.
  int64 ended_at = 10;
  // Populated when `status == errored`.
  string error = 11;
  // Populated when `status == completed`.
  string result = 12;
  AgentMetrics metrics = 13;
}

message AgentSnapshotRef {
  string turn_id = 1;
  string label = 2;
  int64 started_at = 3;
  int64 finished_at = 4;
}

message AgentList {
  // Live (or historical) agents in display order (depth-first).
  repeated AgentEntry agents = 1;
  // Most-recent snapshots for this session (ring of 10), newest first.
  repeated AgentSnapshotRef history = 2;
}

message AgentTreeEvent {
  // Stable wire string: spawned | status_changed | paused | resumed | completed | errored | killed
  string kind = 1;
  AgentEntry agent = 2;
  // Monotonic sequence number. Subscribers detect gaps and re-issue
  // ListAgents on `Lagged` (broadcast) or non-contiguous seq.
  uint64 seq = 3;
}

message AgentSnapshotList {
  repeated AgentSnapshotRef snapshots = 1;
}

message AgentSnapshotRefRequest {
  string session_id = 1;
  string turn_id = 2;
}

message ReloadRequest {
  enum Target {
    TARGET_UNSPECIFIED = 0;
    TARGET_ALL = 1;
    TARGET_MCP = 2;
    TARGET_SKILLS = 3;
  }
  Target target = 1;
}

message ReloadResponse {
  // Names of MCP servers that were not running and are now connected. Empty
  // when the reload did not touch MCP (target=SKILLS).
  repeated string mcp_added = 1;
  // Names of MCP servers torn down. Empty when target=SKILLS.
  repeated string mcp_removed = 2;
  // Count of MCP servers already running that were left alone (limits were
  // reseated in place). Zero when target=SKILLS.
  uint32 mcp_unchanged = 3;
  // Per-server start failures from this reload pass. Empty when target=SKILLS.
  repeated McpReloadFailure mcp_failures = 4;
  // Total MCP tool count visible to the LLM after the reload (post-disabled
  // filtering). Zero when target=SKILLS.
  uint32 mcp_total_tools = 5;

  // Skills counts after the on-disk re-scan. All zero when target=MCP.
  uint32 skills_total = 6;
  uint32 skills_user = 7;
  uint32 skills_user_unavailable = 8;
  uint32 skills_disabled = 9;
}

message McpReloadFailure {
  string server = 1;
  string error = 2;
}

message BrowserManageRequest {
  // "connect" | "disconnect" | "status".
  string action = 1;
  // For "connect": optional CDP URL. Empty means use the default
  // (http://127.0.0.1:9222) and auto-launch a Chromium-family browser
  // when nothing is listening yet.
  string url = 2;
}

message BrowserManageResponse {
  // True iff `browser.cdp_url` is currently set and reachable.
  bool connected = 1;
  // The CDP URL the daemon resolved to (empty when not connected).
  string url = 2;
  // Human-readable progress / diagnostic lines for the TUI transcript
  // and CLI stdout (probe results, auto-launch attempts, etc.).
  repeated string messages = 3;
}

message MonthlyTokenTotal { uint64 total = 1; }
// `present` distinguishes "no rows this month" (false) from "real $0.00"
// (true). Real failure mode without this: a regression returning 0.0 on no
// rows would silently render "$0.0000" in /usage instead of hiding the
// estimated-cost line.
message MonthlyTotalCost { double cost = 1; bool present = 2; }

message KeychainRef {
  string service = 1;
  string account = 2;
}

message ApiKeyValue {
  string provider = 1;
  oneof body {
    string literal = 2;
    KeychainRef keychain = 3;
    Empty unset = 4;
  }
}

message ApiKeyRef { string provider = 1; }

message ApiKeyEntry {
  string provider = 1;
  // "literal" | "keychain" | "unset"
  string backend = 2;
}

message ApiKeyList { repeated ApiKeyEntry entries = 1; }

message ApprovalGreetingRequest {
  string channel = 1;
  string sender_id = 2;
}

message TriggerHeartbeatRequest {
  // "scheduled" or "session_start"
  string source = 1;
  // When true, run even if quiet hours would normally suppress a scheduled
  // heartbeat. Session-start greetings use this because opening the TUI is an
  // explicit user action.
  bool bypass_quiet_hours = 2;
}

message HeartbeatEvent {
  // "scheduled" or "session_start"
  string source = 1;
  int64 started_at_unix = 2;
  int64 finished_at_unix = 3;
  // "ran" | "skipped" | "failed"
  string status = 4;
  string message = 5;
  double duration_ms = 6;
  // "quiet_hours" | "empty_response" | "duplicate_response" | ""
  string skip_reason = 7;
}

message OnboardingState {
  // True when the `onboarded` settings-table key holds "true". The daemon
  // is the single source of truth; the cli no longer probes the DB itself.
  bool onboarded = 1;
}

message ModelChoice {
  string id = 1;
  string label = 2;
  // Short qualifier ("reasoning", "fast, cheap"); "" when none.
  string note = 3;
}

message ProviderChoice {
  string id = 1;
  string label = 2;
  string blurb = 3;
  // Page that issues the key; "" for keyless providers.
  string key_url = 4;
  bool needs_api_key = 5;
  // The preselected row.
  bool recommended = 6;
  // Shown before the "more providers" fold on a first run.
  bool featured = 7;
  // Preselected model id from the curated catalog.
  string default_model = 8;
  repeated ModelChoice models = 9;
}

message DetectedCredential {
  string provider = 1;
  // env | dotenv | claude_cli | ollama | stored | keychain | pool
  string source = 2;
  // A variable name, file path, command path, origin or pool label —
  // never the secret. This crosses gRPC-Web into a browser.
  string detail = 3;
}

message SetupStatus {
  // A provider is chosen AND a credential (or a reachable keyless runtime)
  // backs it. Stored rows count because `Config::load_from_db` folds them
  // into the resolver; `pool` entries are the ones proven to send.
  bool configured = 1;
  // "" when unset.
  string provider = 2;
  string model = 3;
  repeated ProviderChoice providers = 4;
  repeated DetectedCredential detected = 5;
}

message LogActivityRequest {
  string level = 1;
  string source = 2;
  string message = 3;
}

message ActivityLogQuery {
  // Max entries to fetch (capped at 200 server-side).
  uint32 count = 1;
  // Min level: "error" | "warn" | "info" | "debug" | "all". Empty = "info".
  string min_level = 2;
  // Optional category filter; empty = all categories.
  string category = 3;
}

message ActivityLogText {
  string text = 1;
}

message PluginFileHash {
  string path = 1;
  string hash = 2;
}

message PluginInstalledTool {
  string name = 1;
  string description = 2;
  string runtime = 3;
  string plugin_id = 4;
}

message PluginInstalledChannel {
  string name = 1;
  string description = 2;
  string runtime = 3;
  string plugin_id = 4;
  string webhook = 5;
}

message PluginInstallRequest {
  string plugin_id = 1;
  string plugin_name = 2;
  string kind = 3;
  string category = 4;
  repeated PluginFileHash file_hashes = 5;
  PluginInstalledTool installed_tool = 6;
  PluginInstalledChannel installed_channel = 7;
  // JSON blob of credentials map to persist via set_setting("credentials", ...).
  // Empty string = leave credentials unchanged.
  string credentials_json = 8;
}

message PluginInstallResponse {
  uint32 file_hashes_recorded = 1;
}

message Empty {}


message HealReport {
  uint64 pruned_logs = 1;
  uint64 pruned_activity = 2;
  uint64 evicted_embeddings = 3;
  uint64 healed_tasks = 4;
  repeated string warnings = 5;
  uint64 log_bytes_truncated = 6;
  // Never reuse field 7 / name: an older wire-format used it for workflows_pruned.
  reserved 7;
  reserved "workflows_pruned";
  uint64 messages_purged = 8;
  uint64 audit_events_tombstoned = 9;
  uint64 wedged_runs_recovered = 10;
  uint64 backups_pruned = 11;
  string auto_backup_path = 12;
  bool skipped = 13;
}

message DreamReport {
  uint64 entries_extracted = 1;
  uint64 dupes_merged = 2;
  uint64 tokens_used = 3;
  bool nightly_completed = 4;
  bool weekly_completed = 5;
  repeated string warnings = 6;
  string nightly_summary = 7;
  string weekly_summary = 8;
}

message SettingKey { string key = 1; }
message SettingMutation { string key = 1; string value = 2; }
message SettingEntry {
  string key = 1;
  string value = 2;
  // Where the value came from: "db" for an override, otherwise the compiled
  // default. Despite the name this is the *source*, not the display grouping —
  // that is `group` below.
  string category = 3;

  // Display metadata, carried from the curated `TUI_SETTINGS` table so every
  // surface labels a setting the same way. All three are empty for a key that
  // table does not name; a client showing such a key falls back to the key
  // itself and should rank it below the curated ones.
  //
  // Outcome-facing label, e.g. "Show reasoning" for `conversation.show_thinking`.
  string label = 4;
  // Control type: one of bool, float, uint, select, text, secret.
  string kind = 5;
  // Section heading the setting belongs under, e.g. "Conversation".
  string group = 6;
}
message SettingsSnapshot { repeated SettingEntry entries = 1; }

message SessionList {
  repeated SessionSummary sessions = 1;
}
// Options for a session listing. Empty means the default listing, which is
// what an old client sends and what every caller wanted before archived rows
// could be asked for.
message ListSessionsRequest {
  // Include archived sessions, flagged as such. Archiving is a soft hide and
  // this listing is what it hides from, so a client that means to offer a way
  // back has to ask for them.
  bool include_archived = 1;
}
message SessionSummary {
  string id = 1;
  string title = 2;
  uint64 message_count = 3;
  uint64 updated_unix_ts = 4;
  // True when the user pinned this session (exempt from retention purge and
  // stale auto-archive; always present in listings).
  bool pinned = 5;
  // True while a turn runs in this session. Only a live (registry-resident)
  // host can be busy; an evicted session always reports false. This is the
  // snapshot half of the activity feed — `SubscribeSessionActivity` carries
  // the deltas, and a listing reconciles anything a dropped stream missed.
  bool turn_active = 6;
  // True when this session is archived. Only ever set when the request asked
  // for archived rows — the default listing has none to flag.
  bool archived = 7;
  // One line of the newest conversational message, normalized and capped by
  // the daemon so every surface shows the same string, and passed through the
  // same secret redaction an export uses. Empty when the session has only tool
  // results or lifecycle events — a fresh fork, for instance, which carries no
  // rows of its own.
  string last_message_preview = 8;
  // Who said it: "user" or "assistant". Empty alongside an empty preview.
  string last_message_role = 9;
}
message SessionRef { string id = 1; }
// Archive (soft-hide) one session, or restore it. Archiving never deletes —
// `borg sessions list --archived` still finds the row.
message SessionArchiveMutation {
  string id = 1;
  bool archived = 2;
}
// Rename one session. An empty title is rejected — a blank row in the picker
// is indistinguishable from a broken one.
message SessionTitleMutation {
  string id = 1;
  string title = 2;
}
message SessionDetail {
  string id = 1;
  string title = 2;
  repeated MessageView messages = 3;
}
message MessageView {
  string role = 1;
  string text = 2;
  uint64 unix_ts = 3;
  // Assistant rows only: the serialized `Vec<ToolCall>` this turn issued, so a
  // client replaying history can name each tool call and show its arguments.
  // Empty for every other role.
  string tool_calls_json = 4;
  // Tool rows only: the id of the call this row is the result of. Pair it with
  // the preceding assistant row's `tool_calls_json` to recover the tool name —
  // the row itself carries no name.
  string tool_call_id = 5;
}

// Scheduled tasks.
message ScheduledTask {
  string id = 1;
  string name = 2;
  string prompt = 3;
  string schedule_type = 4;
  string schedule_expr = 5;
  string timezone = 6;
  string status = 7;
  int64 next_run_unix = 8; // 0 = none
  uint64 created_at = 9;
  string task_type = 10; // "prompt" or "command"
  string delivery_channel = 11;
  string delivery_target = 12;
}
message ScheduledTaskList { repeated ScheduledTask tasks = 1; }
message ScheduledTaskRef { string id = 1; }
message ScheduledTaskCreate {
  string name = 1;
  string prompt = 2;
  string schedule_type = 3;
  string schedule_expr = 4;
  string timezone = 5;
  string task_type = 6;
  string delivery_channel = 7;
  string delivery_target = 8;
  // 0 = unset (handler picks default).
  int64 next_run_unix = 9;
  // -1 = unset (lets DB default apply); >=0 = explicit.
  int32 max_retries = 10;
  // 0 = unset.
  int64 timeout_ms = 11;
  string allowed_tools = 12;
  // Optional shell preamble (only valid for type=prompt). Stdout is
  // injected into the prompt as `<preprocessed_context>`. Empty = unset.
  string pre_run_command = 13;
  // Optional working directory for `pre_run_command`. Empty = $HOME.
  string pre_run_cwd = 14;
  // Timeout (ms) for `pre_run_command`. 0 = unset (defaults to 60_000).
  int64 pre_run_timeout_ms = 15;
}

message ScheduledTaskRun {
  int64 id = 1;
  string task_id = 2;
  int64 started_at_unix = 3;
  int64 duration_ms = 4;
  string status = 5;
  string result = 6;
  string error = 7;
}
message ScheduledTaskRunList { repeated ScheduledTaskRun runs = 1; }
message GetScheduledTaskRunsRequest {
  string id = 1;
  uint32 limit = 2; // 0 = default
}

message ScheduledTaskDetail {
  ScheduledTask task = 1;
  int32 max_retries = 2;
  int32 retry_count = 3;
  int64 retry_after_unix = 4; // 0 = unset
  string last_error = 5;
  int64 timeout_ms = 6;
  // Last-run convenience (zero/empty if no runs yet).
  bool has_last_run = 7;
  ScheduledTaskRun last_run = 8;
}

message ExportSessionRequest {
  string session_id = 1;
  // "json" | "csv" | "txt" | "md"
  string format = 2;
  // Opt OUT of secret redaction (redaction is on by default, fail-closed).
  bool no_redact = 3;
}
message ExportSessionResponse {
  bytes content = 1;
  string suggested_filename = 2;
}

// Optional fields — empty string means "leave unchanged". Maps to
// borg_core::db::UpdateTask whose `Option<&str>` semantics this mirrors.
message ScheduledTaskUpdate {
  string id = 1;
  string name = 2;
  string prompt = 3;
  string schedule_type = 4;
  string schedule_expr = 5;
  string timezone = 6;
}

message AmbientStatus {
  // Empty when the agent is still the unnamed placeholder. The TUI
  // formatter renders "Base Borg" in that case.
  string evolution_name = 1;
  uint32 level = 2;
  // Lowercase mood string ("stable", "focused", "strained", "learning",
  // "drifting", "ascending"). Empty if unset.
  string mood = 3;
  // Lowercase archetype string. Empty if no dominant archetype.
  string archetype = 4;
}

message WarningList { repeated string warnings = 1; }

// Skills.
message SkillEntry {
  // Frontmatter name — what the catalog, invocation, and shadowing all key on.
  string name = 1;
  // One-line frontmatter description, already capped by the authoring limit.
  string description = 2;
  // True for a skill compiled into the binary, false for one under
  // `~/.borg/skills/`.
  bool builtin = 3;
}
message SkillList { repeated SkillEntry skills = 1; }

// Pairing.
message PairingFilter { string channel_name = 1; } // empty = all
message PairingRequest {
  string id = 1;
  string channel_name = 2;
  string sender_id = 3;
  string code = 4;
  string status = 5;
  string display_name = 6;
  uint64 created_at = 7;
  uint64 expires_at = 8;
}
message PairingRequestList { repeated PairingRequest requests = 1; }
message PairingApproval { string channel_name = 1; string code = 2; }
message ApprovedSender {
  int64 id = 1;
  string channel_name = 2;
  string sender_id = 3;
  string display_name = 4;
  uint64 approved_at = 5;
}
message ApprovedSenderList { repeated ApprovedSender senders = 1; }
message ApprovedSenderRef { string channel_name = 1; string sender_id = 2; }

// Daemon status snapshot — what the TUI's status popup shows.
message DaemonStatus {
  string version = 1;
  uint64 uptime_secs = 2;
  uint64 live_session_count = 3;
  string llm_provider = 4;
  string llm_model = 5;
  uint64 active_tasks = 6;
  uint64 paused_tasks = 7;
  uint64 pending_pairings = 8;
}

// Provider CRUD ─────────────────────────────────────────────────────────────
message AddProviderRequest {
  string id = 1;
  string display_name = 2;
  string base_url = 3;
  string api_key_env = 4;       // empty = none
  string category = 5;          // "byo" | "local" | "public_cloud"
}

message RemoveProviderRequest {
  string id = 1;
}

// Webhook CRUD ──────────────────────────────────────────────────────────────
message CreateWebhookRequest {
  string name = 1;
  string sender_path = 2;
  string thread_path = 3;       // empty = none
  string body_path = 4;
}
message CreateWebhookResponse {
  string name = 1;
  bytes hmac_secret = 2;        // raw key bytes; cli prints once as hex
}
message WebhookRef { string name = 1; }

// Client token CRUD ─────────────────────────────────────────────────────────
message IssueClientTokenRequest {
  string label = 1;
  string scopes = 2;
}
message IssueClientTokenResponse {
  int64 id = 1;
  string label = 2;
  string plaintext = 3;         // returned only at issue time
}
message ClientTokenRef { string label = 1; }
message RevokedClientToken {
  int64 id = 1;
  string label = 2;
  uint64 revoked_at = 3;
}

// Doctor squelch CRUD ───────────────────────────────────────────────────────
message DoctorSquelchSetRequest {
  string category = 1;
  string name = 2;
  // Unix timestamp of expiry. The daemon uses its own clock for `squelched_at`.
  int64 expires_at_unix = 3;
  // Optional free-form reason; empty = no reason recorded.
  string reason = 4;
}

message DoctorSquelchClearRequest {
  string category = 1;
  string name = 2;
}

message DoctorSquelchClearResponse {
  // True if a row was removed; false if no active squelch existed.
  bool removed = 1;
}

// Credential pool admin ─────────────────────────────────────────────────────
// One row of `borg auth list`. Plaintext key is never returned — only the
// fingerprint (16-hex BLAKE3 truncation), source descriptor, and observability
// counters.
message CredentialEntry {
  string id = 1;                       // 6-hex random
  string label = 2;
  string provider = 3;
  uint32 priority = 4;
  // "manual" | "env" | "config"
  string source_kind = 5;
  // For env: var name; for config: config block name; empty for manual.
  string source_value = 6;
  string fingerprint = 7;              // 16-hex
  uint64 use_count = 8;
  // "ok" | "exhausted" | "removed"
  string status = 9;
  int64 last_status_at_ms = 10;        // 0 = unset
  uint32 last_error_code = 11;         // 0 = unset
  string last_error_reason = 12;       // "" = unset
  string last_error_message = 13;      // truncated
  int64 last_error_reset_at_ms = 14;   // 0 = unset
  int64 removed_at_ms = 15;            // 0 = unset
}

message ListCredentialsRequest {
  // Empty = all providers with configured keys.
  string provider = 1;
}

message ProviderCredentials {
  string provider = 1;
  // "fill_first" | "round_robin" | "least_used" | "random"
  string strategy = 2;
  uint64 cooldown_secs = 3;
  uint32 max_concurrent_per_credential = 4;
  repeated CredentialEntry entries = 5;
}

message CredentialList {
  repeated ProviderCredentials providers = 1;
}

message AddCredentialRequest {
  string provider = 1;
  // Plaintext API key. Returned to the client only via its fingerprint.
  string key = 2;
  // Optional operator-friendly label. Empty = autogenerated.
  string label = 3;
}

message RemoveCredentialRequest {
  string provider = 1;
  // Numeric 1-based index, exact label, full id, or unique 4+ hex id-prefix.
  string target = 2;
}

message ResetCredentialsRequest {
  string provider = 1;
  // Optional. Empty = clear every cooldown in the pool. Otherwise a numeric
  // 1-based index, exact label, full id, or unique 4+ hex id-prefix — only
  // that entry is cleared; sibling cooldowns and strike counts stay intact.
  string target = 2;
}

message ResetCredentialsResponse {
  uint64 cleared = 1;
}

message SetCredentialStrategyRequest {
  string provider = 1;
  // "fill_first" | "round_robin" | "least_used" | "random"
  string strategy = 2;
}

message SetCredentialPriorityRequest {
  string provider = 1;
  // Numeric 1-based index, exact label, full id, or unique 4+ hex id-prefix.
  string target = 2;
  // 1-based position in the pool's priority order (1 = tried first).
  uint32 position = 3;
}

message SetCredentialPriorityResponse {
  // The pool's active strategy — lets the client warn when the strategy
  // ("round_robin" | "random") ignores priority.
  string strategy = 1;
  // Live entries in their new priority order.
  repeated CredentialEntry entries = 2;
}

message PairCredentialRequest {
  // Discoverer kind — "claude_code" | "codex" | "copilot" | "qwen_cli".
  string kind = 1;
}

message PairCredentialResponse {
  // Newly-seeded entries. Empty if the discoverer found nothing on disk
  // (e.g. user hasn't run `claude /login`). One entry per detected account.
  repeated CredentialEntry entries = 1;
}

// Subprocess registry ──────────────────────────────────────────────────────
message Subprocess {
  // Monotonic registry id assigned at spawn (not PID — PIDs reuse).
  uint64 id = 1;
  // OS process id at spawn time. `0` for the headless browser, which
  // chromiumoxide doesn't surface — orphan detection works on kind+age.
  uint32 pid = 2;
  // "RunShell" | "Browser" | "Hook" | "ScheduledCommand" | "PreRun"
  string kind = 3;
  // Redacted command string, truncated to 256 chars at register time.
  string command = 4;
  // Owning session id, empty if not tied to a session (e.g. heartbeat).
  string session_id = 5;
  int64 started_at_unix = 6;
  // Empty when still running.
  int64 finished_at_unix = 7;
  bool finished = 8;
  // 0 when not exited / still running. `exit_code_present` distinguishes
  // "real exit 0" from "no exit captured".
  int32 exit_code = 9;
  bool exit_code_present = 10;
  // "Running" | "Exited" | "TimedOut" | "Killed" | "Dead"
  string status = 11;
  // True when the operator has opted this entry out of auto-reap.
  bool pinned = 12;
}

message SubprocessSnapshot {
  repeated Subprocess running = 1;
  repeated Subprocess finished = 2;
}

message SetSubprocessPinnedRequest {
  uint64 id = 1;
  bool pinned = 2;
}

// Goal — Ralph-loop per-session objective ───────────────────────────────────
// Empty `session_id` on the request resolves to the most-recently-updated
// session row server-side, mirroring how the TUI's `/goal …` operates on
// "the current session" without the client needing to track session ids.
message GoalRef {
  string session_id = 1;
}

// Wire projection of `borg_core::goals::Goal`. `present=false` is returned
// when no row exists for the resolved session (or when the requested
// session id was empty and no session has ever been created).
message GoalDetail {
  bool present = 1;
  string session_id = 2;
  string goal_id = 3;
  string objective = 4;
  // "active" | "paused" | "budget_limited" | "complete"
  string status = 5;
  bool token_budget_present = 6;
  int64 token_budget = 7;
  int64 tokens_used = 8;
  int64 time_used_seconds = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

// Mutation request. The `op` discriminator picks which subset of fields is
// meaningful; the server rejects requests where the required fields for
// the chosen op are absent.
message GoalMutation {
  string session_id = 1;
  Op op = 2;
  // OP_CREATE / OP_REPLACE: required, validated against MAX_OBJECTIVE_CHARS.
  string objective = 3;
  bool token_budget_present = 4;
  // OP_CREATE / OP_REPLACE / OP_SET_BUDGET: must be > 0 when present.
  int64 token_budget = 5;
  // OP_SET_STATUS: one of "active" (resume) | "paused" | "complete".
  // BudgetLimited is system-only and cannot be set via this RPC.
  string status = 6;
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_CREATE = 1;       // fail if row already exists for this session
    OP_REPLACE = 2;      // create-or-replace; regenerates goal_id
    OP_SET_STATUS = 3;   // pause / resume / mark complete
    OP_SET_BUDGET = 4;   // change token budget only
  }
}

// Streamed lifecycle event. `goal` is unset only for kind="cleared" (the
// row no longer exists). Subscribers that lag (slow render loop, briefly
// paused TUI) drop messages — the next event or a fresh GetGoal re-syncs
// state, so the broadcast bus stays unbounded-free.
// Tunnel — public-internet exposure ─────────────────────────────────────────
// Snapshot of the daemon's current tunnel state. `provider="none"` and
// `public_url=""` together mean "no tunnel configured"; an explicit
// `error` string means the supervisor's last attempt failed and the
// operator should look at it (e.g. missing binary, bad token).
message TunnelStatusReply {
  // Provider name from `tunnel.provider` (one of "none", "cloudflare",
  // "ngrok", "tailscale", "custom"). Empty only when config load failed.
  string provider = 1;
  // `true` when a tunnel process is alive and serving traffic.
  bool running = 2;
  // Public URL when running. Empty if the provider hasn't surfaced one
  // yet (e.g. cloudflared still booting) or the tunnel is stopped.
  string public_url = 3;
  // Human-readable error from the last start attempt, if any. Drained
  // after a successful start.
  string error = 4;
}

// Quality gates: shell commands that must exit 0 before the goal completes.
message GoalGate {
  int64 ordinal = 1;
  string command = 2;
  // Consecutive failures; reset to 0 whenever the gate passes.
  int64 attempts = 3;
  // Absent until the gate has run at least once.
  bool last_exit_code_present = 4;
  int64 last_exit_code = 5;
}

message GoalGateList {
  repeated GoalGate gates = 1;
  // Human-readable outcome of the mutation, for the client to echo.
  string report = 2;
}

message GoalGateMutation {
  string session_id = 1;
  Op op = 2;
  // OP_ADD: the shell command.
  string command = 3;
  // OP_REMOVE: 1-based ordinal from a prior list.
  int64 ordinal = 4;
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_LIST = 1;
    OP_ADD = 2;
    OP_REMOVE = 3;
    OP_CLEAR = 4;
  }
}

// A recurring prompt that re-enters its own session when that session is idle.
// Distinct from `scheduled_tasks`, which runs an isolated session per tick.
message SessionHeartbeatDetail {
  bool present = 1;
  string session_id = 2;
  string prompt = 3;
  int64 interval_secs = 4;
  bool paused = 5;
  // Seconds until the next eligible fire; 0 when already due.
  int64 seconds_until_due = 6;
  // Human-readable outcome of the mutation, for the client to echo.
  string report = 7;
}

message SessionHeartbeatMutation {
  string session_id = 1;
  Op op = 2;
  // OP_SET: required.
  string prompt = 3;
  // OP_SET: clamped up to the 60s floor server-side.
  int64 interval_secs = 4;
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_STATUS = 1;
    OP_SET = 2;
    OP_PAUSE = 3;
    OP_RESUME = 4;
    OP_CLEAR = 5;
  }
}

// One transition of a session between "a turn is running" and "settled".
message SessionActivityEvent {
  string session_id = 1;
  bool turn_active = 2;
  int64 emitted_at_unix = 3;
}

message GoalEvent {
  string session_id = 1;
  // "created" | "replaced" | "status_changed" | "budget_limited" |
  // "completed" | "cleared"
  string kind = 2;
  GoalDetail goal = 3;
  int64 emitted_at_unix = 4;
}

// /handoff cross-platform session transfer

message HandoffRequest {
  // Session being transferred.
  string session_id = 1;
  // Destination channel name ("telegram", "slack", "discord", ...).
  string target_platform = 2;
}

message HandoffClaimRequest {
  // Channel asking to pick up the next pending handoff targeting it.
  string platform = 1;
}

message HandoffClaimResponse {
  // ID of the claimed session, if any. Empty `session_id` means "nothing
  // pending for this platform" — the caller should poll again later.
  string session_id = 1;
  bool claimed = 2;
}

message HandoffFailRequest {
  string session_id = 1;
  // Human-readable reason — surfaced to the originator via GetHandoffStatus.
  string reason = 2;
}

message HandoffStatusReply {
  // Empty when the session has no handoff history.
  string state = 1;
  string target_platform = 2;
  string error = 3;
  int64 requested_at_unix = 4;
}
