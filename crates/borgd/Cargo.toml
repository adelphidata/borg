[package]
name = "borgd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Borg agent daemon — long-running gRPC host."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "borgd"
path = "src/main.rs"

[dependencies]
protocols = { path = "../protocols" }
cortex = { path = "../cortex" }
gateway = { path = "../gateway" }
heartbeat = { path = "../heartbeat" }
identity = { path = "../identity" }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
spake2 = { workspace = true }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
qrcodegen = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }
fs2 = { workspace = true }
libc = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
# LAN discovery — `mdns-sd` is pure-Rust (no system avahi/bonjour link)
# and runs on macOS + Linux without extra deps. `hostname` resolves the
# local hostname for both mDNS announcement and SAN auto-expansion.
mdns-sd = "0.11"
hostname = "0.4"
which = { workspace = true }

[features]
# Exposes `borgd::session::scripted` (ScriptedBackend + ScriptedFactory) to
# downstream crates' integration tests. Off in production binaries so a real
# `borgd` build cannot accidentally instantiate a no-LLM stub backend.
test-support = []
# Mirrors the cortex `phase9-tests-disabled` gate. Integration tests under
# this flag still call the pre-async rusqlite-style sync DB API and are
# tracked work pending port — off by default keeps the gate green; flip the
# flag locally to grind through them.
phase9-tests-disabled = []

[dev-dependencies]
tempfile = { workspace = true }
libsql = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.5"
chrono = { workspace = true }
