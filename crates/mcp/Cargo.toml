[package]
name = "mcp"
description = "Model Context Protocol client: transports, sessions, tool registry for borg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
async-trait = { workspace = true }
# Process-group signalling (`process_group`), shared with the sandboxed script
# runner so both paths use one macOS EPERM fallback.
sandbox = { path = "../sandbox" }

[target.'cfg(unix)'.dependencies]
# Watchdog reaper for orphaned stdio MCP servers: getppid/kill/killpg/signal.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Job objects: the Windows counterpart to a process group, used to contain a
# stdio MCP server's descendants so they die with it.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES` pointer, so windows-sys
    # gates it behind Win32_Security even though we always pass null.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
axum = { workspace = true }
# The default workspace `tokio` enables `full`; the integration-test
# fixtures need `signal` for graceful shutdown which is included.
tokio = { workspace = true }
chrono = { workspace = true }
rcgen = { workspace = true }

[features]
# Opt-in lane that talks to real MCP servers (e.g. `uvx mcp-server-time`).
# Gated by both this feature AND `BORG_ALLOW_LIVE_TESTS=1` so a default
# `cargo test` stays hermetic. Mirrors `cortex`'s `live-llm` lane.
live-mcp = []

[lints]
workspace = true
