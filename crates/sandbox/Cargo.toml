[package]
name = "sandbox"
description = "macOS Seatbelt and Linux Bubblewrap sandboxing for Borg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tier 1 Windows sandbox runtime (restricted token + DACL ACEs +
# CreateProcessAsUserW). Pulled in only when targeting Windows so the
# Unix builds keep their existing dep set.
[target.'cfg(target_os = "windows")'.dependencies]
rand = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
