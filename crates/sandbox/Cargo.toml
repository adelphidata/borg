[package]
name = "sandbox"
description = "macOS Seatbelt and Linux Bubblewrap sandboxing for Borg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
# Cross-platform-tested helpers (desktop-name suffix, named-pipe nonce,
# stable cap-SID seed, RNG-based unit tests). Windows is where these
# actually run; macOS/Linux builds compile the same code paths through
# the test suite.
rand = { workspace = true }
# Compact wire encoding for binary stdio payloads in the Tier 2 elevated-
# runner IPC protocol (elevated::ipc_runner). Cross-platform — the
# protocol module is unit-tested on every runner, not just Windows.
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Process-group containment for timed-out sandboxed scripts: killpg/kill/getpgid
# (plus proc_listallpids for the macOS per-member fallback).
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Log-capture assertions in `process_group` tests: the group-signalling
# contract distinguishes its error paths only by what it logs.
tracing-subscriber = { workspace = true }

# The Windows FFI smoke test (`tests/windows_ffi_smoke.rs`) constructs a
# real anonymous pipe directly to round-trip the runner protocol over
# kernel I/O. Integration tests can't see regular [dependencies], so the
# minimal feature slice is mirrored here.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
] }

# Tier 1 Windows sandbox runtime (restricted token + DACL ACEs +
# CreateProcessAsUserW). Pulled in only when targeting Windows so the
# Unix builds keep their existing dep set.
[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
hkdf = "0.12"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_StationsAndDesktops",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    # Tier 2 elevated backend:
    #   NetUserAdd / NetLocalGroupAddMembers (account provisioning)
    "Win32_NetworkManagement_NetManagement",
    #   LsaOpenPolicy / LsaAddAccountRights (logon-right grants),
    #   CreateProcessWithLogonW (launch runner as the sandbox account)
    "Win32_Security_Authentication_Identity",
    #   FwpmEngineOpen0 takes a SEC_WINNT_AUTH_IDENTITY_W (Rpc module)
    "Win32_System_Rpc",
] }

[lints]
workspace = true
