[package]
name = "cortex"
description = "Core agent loop, LLM client, memory, and config for Borg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coding = { path = "../coding" }
sandbox = { path = "../sandbox" }
plugins = { path = "../plugins" }
mcp = { path = "../mcp" }
lru = "0.12"
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
url = { workspace = true }
eventsource-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
tiktoken-rs = { workspace = true }
tokio-util = { workspace = true }
rand = { workspace = true }
libsql = { workspace = true }
bytes = "1"
scraper = { workspace = true }
cron = { workspace = true }
regex = { workspace = true }
keyring = { workspace = true }
pdf-extract = { workspace = true }
shellexpand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
rustls-pemfile = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
chromiumoxide = { workspace = true }
unicode-normalization = { workspace = true }
notify = { workspace = true }
image = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
bip39 = "2"
iana-time-zone = "0.1"
nucleo-matcher = "0.3"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Opt-in lane that exercises tool handlers against real network targets
# (`web_fetch`, `web_search`, `browser`). Tests under this feature additionally
# require `BORG_ALLOW_LIVE_TESTS=1` at runtime so a feature-only build still
# stays green offline.
live-llm = []
# Gates test-only auxiliary binaries (e.g., the hermetic `codex app-server`
# fixture) out of regular `cargo build` so they cannot ship in release
# artifacts. Enable explicitly when running integration tests that need the
# fixture binary.
test-support = []
# Gate for legacy sync-DB unit tests that still call the pre-async rusqlite
# `Connection::open_in_memory()` + sync `db.execute(...)` style and haven't
# been ported to the libsql async API yet. Off by default — these tests are
# tracked work, not regressions. The bulk port is a follow-up to the
# turso→libsql backend swap; ungating each site is mechanical but volume-heavy
# (16+ DB test submodules, ~50 unit tests in `settings.rs`).
phase9-tests-disabled = []

# Test fixture: hermetic stand-in for `codex app-server`. Gated behind
# `test-support` so it is not produced by default `cargo build` and never
# lands in a release binary set.
[[bin]]
name = "fake_codex_app_server"
path = "src/bin/fake_codex_app_server.rs"
required-features = ["test-support"]

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
libc = { workspace = true }
wiremock = "0.5"
libsql = { workspace = true }
wasm-encoder = "0.244"
