[package]
name = "cortex"
description = "Core agent loop, LLM client, memory, and config for Borg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
coding = { path = "../coding" }
sandbox = { path = "../sandbox" }
tokio = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
tiktoken-rs = { workspace = true }
tokio-util = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
scraper = { workspace = true }
cron = { workspace = true }
regex = { workspace = true }
keyring = { workspace = true }
pdf-extract = { workspace = true }
shellexpand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
chromiumoxide = { workspace = true }
unicode-normalization = { workspace = true }
notify = { workspace = true }
image = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
bip39 = "2"
iana-time-zone = "0.1"
nucleo-matcher = "0.3"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Opt-in lane that exercises tool handlers against real network targets
# (`web_fetch`, `web_search`, `browser`). Tests under this feature additionally
# require `BORG_ALLOW_LIVE_TESTS=1` at runtime so a feature-only build still
# stays green offline.
live-llm = []

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
libc = { workspace = true }
wiremock = "0.5"
rusqlite = { workspace = true }
